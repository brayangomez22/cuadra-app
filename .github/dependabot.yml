version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # openapi-typescript 7 pide typescript ^5: la 7 rompe `npm ci` (P74).
      # Quitar cuando openapi-typescript la acepte.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Los tipos siguen la versión de Node del proyecto (frontend/.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
