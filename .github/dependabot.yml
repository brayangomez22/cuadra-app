version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # Disabled until frontend/ exists (T12): without a manifest the update fails.
  # - package-ecosystem: npm
  #   directory: /frontend
  #   schedule:
  #     interval: weekly
  #   groups:
  #     npm:
  #       patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
