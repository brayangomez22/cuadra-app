# Ferretería: las unidades son las que tenía el catálogo fijo antes de T24d.
name: Ferretería
description: Herramientas, materiales de construcción, eléctricos, plomería y pinturas.
modules: [unit_conversions]
# Tasa de IVA que se propone a un producto nuevo.
default_tax_rate: "0.19"
# dian_code: código UN/ECE Rec 20 de la unidad en la factura electrónica; sin él, la factura usa "94" (unidad).
units:
  - {code: und, name: Unidad, dian_code: "94"}
  - {code: m, name: Metro, dian_code: MTR}
  - {code: kg, name: Kilogramo, dian_code: KGM}
  - {code: l, name: Litro, dian_code: LTR}
  - {code: caja, name: Caja}
  - {code: rollo, name: Rollo}
  - {code: bulto, name: Bulto}
  - {code: galon, name: Galón, dian_code: GLL}
categories:
  - Herramientas
  - Construcción
  - Eléctricos
  - Plomería
  - Pinturas
  - Tornillería
attributes:
  - {key: marca, label: Marca, type: text}
  - {key: material, label: Material, type: text}
variant_axes: []
customer_segments: [Público, Maestro de obra, Contratista, Empresa]
