# Papelería: útiles, oficina y servicios de impresión.
name: Papelería
description: Útiles escolares, artículos de oficina, arte, impresiones y fotocopias.
modules: []
# Tasa de IVA que se propone a un producto nuevo.
default_tax_rate: "0.19"
# dian_code: código UN/ECE Rec 20 de la unidad en la factura electrónica; sin él, la factura usa "94" (unidad).
units:
  - {code: und, name: Unidad, dian_code: "94"}
  - {code: paquete, name: Paquete}
  - {code: caja, name: Caja}
  - {code: resma, name: Resma}
  - {code: docena, name: Docena, dian_code: DZN}
  - {code: pliego, name: Pliego}
  - {code: m, name: Metro, dian_code: MTR}
categories:
  - Útiles escolares
  - Oficina
  - Arte y manualidades
  - Impresión y fotocopias
  - Tecnología
attributes:
  - {key: marca, label: Marca, type: text}
  - {key: color, label: Color, type: text}
variant_axes: []
customer_segments: [Público, Colegio, Empresa]
