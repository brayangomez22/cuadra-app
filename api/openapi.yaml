        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [customers]
      operationId: createCustomerSegment
      summary: Crear un segmento de cliente
      x-permission: customers:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSegmentInput"
      responses:
        "201":
          description: Segmento creado.
          content:
            application/json:
