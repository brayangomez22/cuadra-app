                $ref: "#/components/schemas/Error"
        "422":
          description: El nombre no es válido (`invalid_location_name`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/locations/{locationId}/stock:
    parameters:
      - $ref: "#/components/parameters/LocationId"
    get:
      tags: [inventory]
      operationId: listStock
      summary: Existencias de una sede
      description: |
        Las variantes que han tenido movimientos en la sede, con su cantidad y costo promedio. Una variante sin
        movimientos no aparece (su existencia es cero).
      x-permission: inventory:read
      parameters:
        - name: variant_id
          in: query
          description: Solo la existencia de esta variante.
          required: false
          schema:
            type: string
            format: uuid
        - name: product_id
          in: query
          deprecated: true
          description: |
            Solo la existencia de la variante por defecto de este producto. Use `variant_id`; no se envían los dos
            (`variant_required`).
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de existencias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLevelPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Se enviaron `variant_id` y `product_id` a la vez (`variant_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/variants/{variantId}/kardex:
    parameters:
      - $ref: "#/components/parameters/VariantId"
    get:
      tags: [inventory]
      operationId: getVariantKardex
      summary: Kardex de una variante
      description: |
        Los movimientos de la variante, del más reciente al más antiguo. `balance_after` es el saldo en la sede
        del movimiento justo después de él. Una variante sin movimientos, o de otra empresa, tiene el kardex vacío.
      x-permission: inventory:read
      parameters:
        - name: location_id
          in: query
          description: Solo los movimientos de esta sede.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página del kardex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}/kardex:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [inventory]
      operationId: getKardex
      deprecated: true
      summary: Kardex de la variante por defecto de un producto
      description: |
        El kardex de la variante por defecto del producto. Use `GET /api/v1/variants/{variantId}/kardex`. Un
        producto que no existe tiene el kardex vacío.
      x-permission: inventory:read
      parameters:
        - name: location_id
          in: query
          description: Solo los movimientos de esta sede.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página del kardex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/receipts:
    post:
      tags: [inventory]
      operationId: receiveStock
      summary: Registrar una entrada de mercancía
      description: |
        Suma la cantidad a la existencia de la sede y recalcula el costo promedio ponderado. Sirve también para el
        inventario inicial.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: El movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `invalid_unit_cost`, `variant_required`,
            `variant_not_found`, `product_not_found`, `location_not_found`, `location_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/adjustments:
    post:
      tags: [inventory]
      operationId: adjustStock
      summary: Registrar un ajuste de inventario
      description: |
        Corrige la existencia en la cantidad indicada (positiva suma, negativa resta) por un motivo obligatorio. Se
        valora al costo promedio y no lo cambia.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentInput"
      responses:
        "201":
          description: El movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No hay stock suficiente en la sede (`insufficient_stock`) y la empresa no permite stock negativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `adjustment_reason_required`,
            `adjustment_reason_too_long`, `variant_required`, `variant_not_found`, `product_not_found`,
            `location_not_found`, `location_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/transfers:
    post:
      tags: [inventory]
      operationId: transferStock
      summary: Trasladar mercancía entre sedes
      description: |
        Saca la cantidad de la sede de origen y la entra en la de destino, valorada al costo promedio del origen.
        Los dos movimientos comparten la misma referencia de traslado.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Los dos movimientos del traslado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No hay stock suficiente en la sede (`insufficient_stock`) y la empresa no permite stock negativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `same_location_transfer`, `variant_required`,
            `variant_not_found`, `product_not_found`, `location_not_found`, `location_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sales:
    get:
      tags: [sales]
      operationId: listSales
      summary: Ventas del día
      description: |
        Las ventas confirmadas (y las anuladas) de un día en hora de Colombia (`America/Bogota`), de la más reciente
        a la más antigua. Sin `date`, el día de hoy.
      x-permission: sales:read
      parameters:
        - name: date
          in: query
          description: Día en hora de Colombia (`YYYY-MM-DD`).
          required: false
          schema:
            type: string
            format: date
        - name: location_id
          in: query
          description: Solo las ventas de esta sede.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de ventas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [sales]
      operationId: confirmSale
      summary: Confirmar una venta
      description: |
        Cobra el carrito completo en una sola operación: arma la venta con los precios del catálogo, valida los
        descuentos contra el tope del usuario y los pagos contra el total, registra las salidas de inventario y le
        asigna el consecutivo de la sede. Si algo falla, no se guarda nada.

        Solo el efectivo da cambio. Quien no tiene `sales:discount` descuenta hasta el tope que fijó la empresa
        (por defecto, 0 %).
      x-permission: sales:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSaleInput"
      responses:
        "201":
          description: La venta confirmada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            El usuario no tiene permiso (`forbidden`) o un descuento supera su tope (`discount_exceeds_limit`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            No hay stock suficiente de una variante (`insufficient_stock`); `details.variant_id` dice cuál y
            `details.product_id` (deprecated), su producto. El usuario
            no tiene caja abierta y la empresa la exige (`cash_session_required`), o la caja se cerró
            (`cash_session_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`variant_required`; `product_not_found` y `product_inactive`, también
            para una variante; `location_not_found`,
            `location_inactive`, `insufficient_payment`, `non_cash_overpayment`, `invalid_quantity`,
            `invalid_discount`, `invalid_payment_amount`, `sale_without_lines`, `cash_session_location_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sales/discount-limit:
    get:
      tags: [sales]
      operationId: getDiscountLimit
      summary: Tope de descuento del usuario
      description: |
        Cuánto puede descontar el usuario autenticado en cada línea, para que el POS muestre u oculte el campo de
        descuento. Quien tiene `sales:discount` no tiene tope (`unlimited`); los demás tienen el que fijó la
        empresa (por defecto, 0 %). La API vuelve a aplicar el tope al confirmar la venta.
      x-permission: sales:create
      responses:
        "200":
          description: El tope del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sales/{saleId}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [sales]
      operationId: getSale
      summary: Detalle de una venta
      x-permission: sales:read
      responses:
        "200":
          description: La venta con sus líneas, pagos y totales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La venta no existe (`sale_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sales/{saleId}/void:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    post:
      tags: [sales]
      operationId: voidSale
      summary: Anular una venta
      description: |
        Anula una venta confirmada y devuelve al inventario exactamente lo que salió, con movimientos `sale_void`.
        La venta conserva su consecutivo. Una venta anulada no se puede volver a anular.
      x-permission: sales:void
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidSaleInput"
      responses:
        "200":
          description: La venta anulada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La venta no existe (`sale_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La venta no está confirmada; por ejemplo, ya fue anulada (`sale_not_confirmed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Falta el motivo o es muy largo (`invalid_void_reason`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/cash-sessions:
    post:
      tags: [cash]
      operationId: openCashSession
      summary: Abrir la caja
      description: Abre la caja del usuario autenticado en una sede, con la base inicial en efectivo.
      x-permission: sales:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCashSessionInput"
      responses:
        "201":
          description: La caja abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: El usuario ya tiene una caja abierta (`cash_session_already_open`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: La sede no existe (`location_not_found`) o la base no es válida (`invalid_opening_float`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cash-sessions/current:
    get:
      tags: [cash]
      operationId: getCurrentCashSession
      summary: Caja actual del usuario
      description: |
        Si la empresa exige caja abierta para vender (`required`) y la caja abierta del usuario autenticado, con sus
        movimientos. Sin caja abierta, `session` no viene.
      x-permission: sales:create
      responses:
        "200":
          description: La caja actual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCashSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cash-sessions/{cashSessionId}:
    parameters:
      - $ref: "#/components/parameters/CashSessionId"
    get:
      tags: [cash]
      operationId: getCashSession
      summary: Detalle de una caja
      description: La caja con sus movimientos y, si está cerrada, el reporte de cierre.
      x-permission: sales:read
      responses:
        "200":
          description: La caja.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La caja no existe (`cash_session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cash-sessions/{cashSessionId}/movements:
    parameters:
      - $ref: "#/components/parameters/CashSessionId"
    post:
      tags: [cash]
      operationId: recordCashMovement
      summary: Registrar un ingreso o egreso de caja
      description: Registra un ingreso o un egreso de efectivo con su motivo en la caja abierta del usuario.
      x-permission: sales:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashMovementInput"
      responses:
        "201":
          description: El movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashMovement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            El usuario no tiene permiso (`forbidden`) o la caja es de otro usuario (`cash_session_not_owner`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La caja no existe (`cash_session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La caja está cerrada (`cash_session_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            El monto o el motivo no son válidos (`invalid_cash_movement_amount`, `invalid_cash_movement_reason`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cash-sessions/{cashSessionId}/close:
    parameters:
      - $ref: "#/components/parameters/CashSessionId"
    post:
      tags: [cash]
      operationId: closeCashSession
      summary: Cerrar la caja con arqueo
      description: |
        Cierra la caja del usuario con el conteo del efectivo por denominación. La API calcula el esperado (base +
        efectivo recibido + ingresos − egresos − cambio entregado, de las ventas confirmadas de la caja) y la
        diferencia con lo contado. El cierre no se puede modificar después.
      x-permission: sales:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseCashSessionInput"
      responses:
        "200":
          description: La caja cerrada, con el reporte de cierre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            El usuario no tiene permiso (`forbidden`) o la caja es de otro usuario (`cash_session_not_owner`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La caja no existe (`cash_session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La caja ya está cerrada (`cash_session_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            El conteo no es válido (`invalid_denomination`, `invalid_denomination_quantity`,
            `duplicate_denomination`) o las notas son muy largas (`invalid_cash_notes`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  headers:
    SetRefreshCookie:
      description: |
        Cookie `cuadra_refresh` con el refresh token (HttpOnly, Secure, SameSite=Strict, ruta `/api/v1/auth`).
        Al cerrar sesión o si la sesión no es válida, la cookie se borra.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: Cantidad máxima de resultados.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Cantidad de resultados a saltar.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
      example: variants
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttributeId:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AxisId:
      name: axisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CashSessionId:
      name: cashSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefreshCookie:
      name: cuadra_refresh
      in: cookie
      description: Refresh token. Lo pone la API; el navegador lo envía solo a `/api/v1/auth`.
      required: false
      schema:
        type: string
        maxLength: 200

  responses:
    BadRequest:
      description: La request no cumple el contrato (`code` = `invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Falta el token o no es válido (`code` = `unauthorized`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: El usuario no tiene permiso para esta acción (`code` = `forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: El recurso no existe (`code` = `not_found` u otro más específico).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        La operación choca con el estado actual (por ejemplo, un SKU duplicado o `insufficient_stock`: no hay stock
        suficiente).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: La request es válida, pero viola una regla de negocio (por ejemplo, `invalid_quantity`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Error inesperado del servidor (`code` = `internal_error`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      example:
        error:
          code: insufficient_stock
          message: No hay stock suficiente de Producto X
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable, en snake_case, para que el cliente decida qué hacer.
        message:
          type: string
          description: Mensaje en español que se puede mostrar al usuario.
        details:
          type: object
          description: |
            Datos del error para el cliente, solo en los códigos que lo documentan (por ejemplo, `variant_id` en
            `insufficient_stock`). Nunca trae datos personales.
          additionalProperties:
            type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    SignUpRequest:
      type: object
      required: [tenant_name, nit, name, email, password]
      additionalProperties: false
      properties:
        tenant_name:
          type: string
          description: Nombre de la empresa.
          minLength: 1
          maxLength: 200
          example: Mi Negocio
        nit:
          type: string
          description: NIT con dígito de verificación (`890903938-8`).
          minLength: 2
          maxLength: 20
          example: 890903938-8
        name:
          type: string
          description: Nombre del dueño.
          minLength: 1
          maxLength: 200
          example: Ana Gómez
        email:
          type: string
          minLength: 3
          maxLength: 254
          example: ana@minegocio.co
        password:
          type: string
          description: Entre 8 y 72 caracteres.
          format: password
          minLength: 8
          maxLength: 72
        business_template:
          type: string
          description: |
            Plantilla de tipo de negocio (`GET /api/v1/business-templates`). Sin ella, la empresa
            empieza con la plantilla `generica`.
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          example: generica
    BusinessTemplate:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
          example: generica
        name:
          type: string
          example: Negocio general
        description:
          type: string
    BusinessTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BusinessTemplate"
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
        tenant_id:
          type: string
          format: uuid
          description: Empresa elegida tras una respuesta 409 `tenant_selection_required`.
    AuthSession:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: "JWT para el header `Authorization: Bearer`."
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Segundos de vida del access token.
          example: 900
        user:
          $ref: "#/components/schemas/Me"
    Me:
      type: object
      required: [id, tenant_id, tenant_name, tenant_nit, business_template, default_tax_rate, name, email, role, permissions, modules]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        tenant_nit:
          type: string
          description: NIT de la empresa con dígito de verificación, para la tirilla y los documentos.
          example: 890903938-8
        business_template:
          type: string
          description: Plantilla de tipo de negocio con la que se registró la empresa.
          example: generica
        default_tax_rate:
          allOf:
            - $ref: "#/components/schemas/TaxRate"
          description: La tasa de IVA que se propone a un producto nuevo. La siembra la plantilla de la empresa.
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, cashier, warehouse]
        permissions:
          type: array
          description: |
            Permisos del rol, para mostrar u ocultar acciones en la UI. Incluye los de los módulos activos.
          items:
            type: string
          example: [catalog:read, sales:create]
        modules:
          type: array
          description: Módulos activos de la empresa, para mostrar u ocultar menús, columnas y campos.
          items:
            type: string
          example: [variants]
    TenantSelectionRequired:
      type: object
      required: [error, tenants]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantOption"
    TenantOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Money:
      type: string
      description: Monto en pesos colombianos, como decimal en string (hasta 4 decimales).
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      example: "12500.00"
    TaxRate:
      type: string
      description: Tasa de IVA como fracción decimal (`0.19` es 19 %), menor que 1 y con hasta 4 decimales.
      pattern: '^0(\.\d{1,4})?$'
      example: "0.19"
    UnitCode:
      type: string
      description: El código de una unidad de medida de la empresa (`und`, `m`).
      minLength: 1
      maxLength: 16
      example: m
    UnitOfMeasure:
      type: object
      required: [id, code, name]
      description: Una unidad de medida de la empresa, en la que se cuentan y se venden sus productos.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Lo que se muestra junto a una cantidad ("2,5 m"). Único en la empresa, en minúsculas.
          example: m
        name:
          type: string
          example: Metro
    UnitInput:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Único en la empresa, sin espacios. Se guarda en minúsculas.
          minLength: 1
          maxLength: 16
          example: par
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Par
    Module:
      type: object
      required: [id, name, depends_on, active]
      properties:
        id:
          type: string
          example: variants
        name:
          type: string
          example: Variantes
        depends_on:
          type: array
          description: Módulos que deben estar activos para activar este.
          items:
            type: string
        active:
          type: boolean
    ModuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Module"
    ModuleUpdate:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active:
          type: boolean
    UnitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UnitOfMeasure"
    AttributeType:
      type: string
      enum: [text, number, list, boolean]
      description: |
        El tipo de valor del atributo: texto libre (`text`), número decimal (`number`), una opción de una lista
        (`list`) o sí/no (`boolean`).
    AttributeDefinition:
      type: object
      required: [id, key, label, type, options, required]
      description: Un atributo que la empresa define para sus productos (marca, material, principio activo...).
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: La clave con la que los productos guardan el valor. No cambia.
          example: marca
        label:
          type: string
          example: Marca
        type:
          $ref: "#/components/schemas/AttributeType"
        options:
          type: array
          description: Las opciones de un atributo de lista, en su orden; vacío para los demás tipos.
          items:
            type: string
        required:
          type: boolean
          description: Si todo producto debe tener un valor.
    AttributeDefinitionInput:
      type: object
      required: [key, label, type, required]
      additionalProperties: false
      properties:
        key:
          type: string
          description: Minúsculas sin tildes, números y `_`, empezando por una letra. No se puede cambiar después.
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 50
          example: principio_activo
        label:
          type: string
          minLength: 1
          maxLength: 100
          example: Principio activo
        type:
          $ref: "#/components/schemas/AttributeType"
        options:
          $ref: "#/components/schemas/AttributeOptions"
        required:
          type: boolean
    AttributeDefinitionUpdate:
      type: object
      required: [label, required]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        options:
          $ref: "#/components/schemas/AttributeOptions"
        required:
          type: boolean
    AttributeOptions:
      type: array
      description: |
        Obligatorias para un atributo de lista y prohibidas para los demás. Sin repetir (sin importar las mayúsculas).
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 100
    AttributeDefinitionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttributeDefinition"
    AttributeValue:
      description: |
        Un texto para los atributos de texto, número y lista (un número va como texto decimal, `"2.5"`, nunca como
        número JSON) o un booleano para los de sí/no.
      x-go-type: interface{}
      oneOf:
        - type: string
          maxLength: 500
        - type: boolean
    ProductAttributes:
      type: object
      description: |
        Los valores del producto para los atributos de la empresa, por clave. Cada valor se valida contra la
        definición de su atributo.
      additionalProperties:
        $ref: "#/components/schemas/AttributeValue"
      example: {"marca": "Acme", "importado": true}
    VariantAxis:
      type: object
      required: [id, name, values]
      description: Un eje en el que varían las variantes de la empresa (color, tamaño, presentación...) y sus valores.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: En minúsculas. Es el nombre del eje en `axis_values` y no cambia.
          example: color
        values:
          type: array
          description: Los valores que admite el eje, en su orden.
          items:
            type: string
          example: [Rojo, Azul]
    VariantAxisInput:
      type: object
      required: [name, values]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Único en la empresa. Se guarda en minúsculas.
          minLength: 1
          maxLength: 50
          example: Color
        values:
          $ref: "#/components/schemas/VariantAxisValues"
    VariantAxisUpdate:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          $ref: "#/components/schemas/VariantAxisValues"
    VariantAxisValues:
      type: array
      description: Al menos un valor, sin repetir (sin importar las mayúsculas).
      minItems: 1
      maxItems: 200
      items:
        type: string
        minLength: 1
        maxLength: 100
    VariantAxisList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VariantAxis"
    ProductInput:
      type: object
      description: |
        Los datos del producto y los de su variante por defecto (`sku`, `barcode`, `cost` y `price`). Las demás
        variantes se editan con `/products/{productId}/variants`. La unidad base va en `base_unit_id` o, mientras
        el frontend pasa a `base_unit_id`, por su código en `base_unit` (deprecated): una de las dos. Los
        atributos se validan contra las definiciones de la empresa (`/product-attributes`).
      required: [sku, name, cost, price, tax_rate]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Código interno de la variante por defecto, único en la empresa. Se guarda en mayúsculas.
          minLength: 1
          maxLength: 64
          example: CIN-18
        barcode:
          type: string
          description: Código de barras, único en la empresa. Vacío u omitido si no tiene.
          maxLength: 64
          example: "7701234567890"
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Cinta adhesiva transparente 18 mm
        description:
          type: string
          maxLength: 2000
        category_id:
          type: string
          format: uuid
          nullable: true
        base_unit_id:
          type: string
          format: uuid
          description: La unidad de medida en la que se cuenta y se vende el producto.
        base_unit:
          allOf:
            - $ref: "#/components/schemas/UnitCode"
          deprecated: true
          description: El código de la unidad base. Use `base_unit_id`.
        cost:
          $ref: "#/components/schemas/Money"
        price:
          $ref: "#/components/schemas/Money"
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
        attributes:
          allOf:
            - $ref: "#/components/schemas/ProductAttributes"
          description: |
            Los valores de los atributos de la empresa. Si se omite al editar, el producto conserva los que tiene.
    AxisValues:
      type: object
      description: |
        El valor de la variante en cada eje que define la empresa (`{"color": "Azul"}`, ver `/variant-axes`), hasta
        5 ejes. Los nombres de los ejes se guardan en minúsculas y cada valor como lo escribe su eje ("azul" se
        guarda "Azul"). Vacío en la variante de un producto simple.
      maxProperties: 5
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 100
      example: {"color": "Azul"}
    ProductVariantInput:
      type: object
      required: [sku, cost, price, axis_values]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Código interno, único en la empresa. Se guarda en mayúsculas.
          minLength: 1
          maxLength: 64
        barcode:
          type: string
          description: Código de barras, único en la empresa. Vacío u omitido si no tiene.
          maxLength: 64
        cost:
          $ref: "#/components/schemas/Money"
        price:
          $ref: "#/components/schemas/Money"
        axis_values:
          $ref: "#/components/schemas/AxisValues"
    ProductVariantUpdate:
      type: object
      required: [sku, cost, price, axis_values, active]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Código interno, único en la empresa. Se guarda en mayúsculas.
          minLength: 1
          maxLength: 64
        barcode:
          type: string
          description: Código de barras, único en la empresa. Vacío u omitido si no tiene.
          maxLength: 64
        cost:
          $ref: "#/components/schemas/Money"
        price:
          $ref: "#/components/schemas/Money"
        axis_values:
          $ref: "#/components/schemas/AxisValues"
        active:
          type: boolean
          description: Una variante inactiva no se vende.
    ProductVariant:
      type: object
      required: [id, sku, price, price_with_tax, axis_values, label, is_default, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
          description: Se omite si la variante no tiene.
        price:
          $ref: "#/components/schemas/Money"
        price_with_tax:
          $ref: "#/components/schemas/Money"
        cost:
          $ref: "#/components/schemas/Money"
        margin_percent:
          type: string
          description: Margen sobre el precio de venta, en porcentaje. Es negativo si el precio está por debajo del costo.
          example: "16.6667"
        axis_values:
          $ref: "#/components/schemas/AxisValues"
        label:
          type: string
          description: |
            El nombre de la variante: sus valores ordenados por nombre de eje (`Rojo · M`), como lo congela una venta en
            `variant_label`. Vacío si la variante no tiene ejes.
          example: Rojo · M
        is_default:
          type: boolean
          description: La variante creada con el producto. Un producto simple solo tiene esta.
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
      description: |
        Lo que se vende y se cuenta: el producto en una combinación de sus ejes. El precio no incluye IVA;
        `price_with_tax` lo incluye con la tasa del producto, redondeado a 2 decimales. `cost` y `margin_percent`
        solo se envían a quien puede editar el catálogo (`catalog:write`).
    Product:
      type: object
      required: [id, sku, name, base_unit_id, unit, base_unit, price, price_with_tax, tax_rate, attributes, active, created_at, variants]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          deprecated: true
          description: El de la variante por defecto. Use `variants`.
          example: CIN-18
        barcode:
          type: string
          deprecated: true
          description: El de la variante por defecto; se omite si no tiene. Use `variants`.
        name:
          type: string
        description:
          type: string
          description: Se omite si está vacía.
        category_id:
          type: string
          format: uuid
          description: Se omite si el producto no tiene categoría.
        base_unit_id:
          type: string
          format: uuid
        unit:
          $ref: "#/components/schemas/UnitOfMeasure"
        base_unit:
          allOf:
            - $ref: "#/components/schemas/UnitCode"
          deprecated: true
          description: El código de `unit`. Use `unit`.
        cost:
          allOf:
            - $ref: "#/components/schemas/Money"
          deprecated: true
          description: El de la variante por defecto. Use `variants`.
        price:
          allOf:
            - $ref: "#/components/schemas/Money"
          deprecated: true
          description: El de la variante por defecto. Use `variants`.
        price_with_tax:
          allOf:
            - $ref: "#/components/schemas/Money"
          deprecated: true
          description: El de la variante por defecto. Use `variants`.
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
        attributes:
          $ref: "#/components/schemas/ProductAttributes"
        margin_percent:
          type: string
          deprecated: true
          description: El de la variante por defecto. Use `variants`.
          example: "16.6667"
        active:
          type: boolean
          description: Un producto inactivo no se vende, con ninguna de sus variantes.
        created_at:
          type: string
          format: date-time
        variants:
          type: array
          minItems: 1
          description: Sus variantes, en el orden en que se agregaron; la variante por defecto va primero.
          items:
            $ref: "#/components/schemas/ProductVariant"
      description: |
        Un producto del catálogo: lo que comparten sus variantes (nombre, categoría, unidad base y tasa de IVA).
        `sku`, `barcode`, `cost`, `price`, `price_with_tax` y `margin_percent` son los de la variante por defecto y se
        mantienen mientras el frontend pasa a `variants`. `cost` y `margin_percent` solo se envían a quien puede
        editar el catálogo (`catalog:write`).
    ProductPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          description: Cantidad total de productos que cumplen el filtro, sin paginar.
    CategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Aseo
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Categoría padre. Omitido o `null`, la categoría queda en la raíz.
    Category:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          description: Se omite si la categoría está en la raíz.
        created_at:
          type: string
          format: date-time
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Quantity:
      type: string
      description: Cantidad en la unidad base del producto, como decimal en string (hasta 4 decimales).
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      example: "2.5"
    SignedQuantity:
      type: string
      description: Cantidad con signo (negativa si sale), como decimal en string (hasta 4 decimales).
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      example: "-3"
    LocationInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Bodega principal
    Location:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    StockLevel:
      type: object
      required: [variant_id, product_id, location_id, quantity]
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante, para mostrar su nombre.
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        average_cost:
          $ref: "#/components/schemas/Money"
      description: |
        La existencia de una variante en una sede. `quantity` es negativa solo si la empresa permite vender sin
        stock. `average_cost` (costo promedio ponderado, sin IVA) solo se envía a quien tiene `catalog:write`.
    StockLevelPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockLevel"
        total:
          type: integer
          description: Cantidad total de existencias que cumplen el filtro, sin paginar.
    DocumentRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [purchase, sale, transfer]
        id:
          type: string
          format: uuid
    StockMovement:
      type: object
      required: [id, variant_id, product_id, location_id, type, quantity, balance_after, user_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante, para mostrar su nombre.
        location_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [purchase_in, sale_out, sale_void, adjustment, transfer_out, transfer_in]
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        unit_cost:
          $ref: "#/components/schemas/Money"
        balance_after:
          $ref: "#/components/schemas/SignedQuantity"
        average_cost_after:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          description: Motivo del ajuste. Se omite en los demás tipos.
        reference:
          $ref: "#/components/schemas/DocumentRef"
        user_id:
          type: string
          format: uuid
          description: Quién registró el movimiento.
        occurred_at:
          type: string
          format: date-time
      description: |
        Un movimiento del kardex. `quantity` es positiva si entra y negativa si sale. `unit_cost` y
        `average_cost_after` solo se envían a quien tiene `catalog:write`. `reference` se omite si no hay documento.
    StockMovementPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockMovement"
        total:
          type: integer
          description: Cantidad total de movimientos que cumplen el filtro, sin paginar.
    ReceiptInput:
      type: object
      required: [location_id, quantity, unit_cost]
      additionalProperties: false
      description: Lleva `variant_id` o, por compatibilidad, `product_id`; uno de los dos, no ambos (`variant_required`).
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          deprecated: true
          description: Se resuelve a la variante por defecto del producto. Use `variant_id`.
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
        unit_cost:
          $ref: "#/components/schemas/Money"
    AdjustmentInput:
      type: object
      required: [location_id, quantity, reason]
      additionalProperties: false
      description: Lleva `variant_id` o, por compatibilidad, `product_id`; uno de los dos, no ambos (`variant_required`).
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          deprecated: true
          description: Se resuelve a la variante por defecto del producto. Use `variant_id`.
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Unidad dañada en la bodega
    TransferInput:
      type: object
      required: [from_location_id, to_location_id, quantity]
      additionalProperties: false
      description: Lleva `variant_id` o, por compatibilidad, `product_id`; uno de los dos, no ambos (`variant_required`).
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          deprecated: true
          description: Se resuelve a la variante por defecto del producto. Use `variant_id`.
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
    TransferResult:
      type: object
      required: [out, in]
      properties:
        out:
          $ref: "#/components/schemas/StockMovement"
        in:
          $ref: "#/components/schemas/StockMovement"
    ConfirmSaleInput:
      type: object
      required: [location_id, lines, payments]
      additionalProperties: false
      properties:
        location_id:
          type: string
          format: uuid
          description: Sede donde se vende y de donde sale el stock.
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SaleLineInput"
        payments:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PaymentInput"
    SaleLineInput:
      type: object
      description: |
        Una línea del carrito: una variante y la cantidad. Lleva `variant_id` o, por compatibilidad, `product_id`;
        uno de los dos, no ambos (`variant_required`). `discount` es un monto en pesos sobre la línea, antes de IVA
        (por defecto, 0). El precio lo pone el servidor.
      required: [quantity]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          deprecated: true
          description: Se resuelve a la variante por defecto del producto. Use `variant_id`.
        quantity:
          $ref: "#/components/schemas/Quantity"
        discount:
          $ref: "#/components/schemas/Money"
    PaymentMethod:
      type: string
      enum: [cash, card, nequi, daviplata, transfer]
      description: Medio de pago. Solo el efectivo (`cash`) da cambio.
    PaymentInput:
      type: object
      description: Un pago. En efectivo, `amount` es lo entregado e incluye el cambio.
      required: [method, amount]
      additionalProperties: false
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          $ref: "#/components/schemas/Money"
    VoidSaleInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: El cliente desistió de la compra
    DiscountLimit:
      type: object
      description: |
        Tope de descuento de una línea como fracción de su bruto (`0.10` permite descontar el 10 %). Con
        `unlimited`, `max` es `1`.
      required: [unlimited, max]
      properties:
        unlimited:
          type: boolean
        max:
          type: string
          pattern: '^(0(\.\d{1,4})?|1(\.0{1,4})?)$'
          example: "0.10"
    SaleStatus:
      type: string
      enum: [confirmed, voided]
    SaleLine:
      type: object
      description: |
        Una línea vendida: una variante de un producto. `unit_price` es sin IVA, en el momento de la venta, y
        `price_rule` dice qué regla lo dio. `gross` = cantidad × precio redondeado a 2 decimales; `base` = `gross` −
        `discount`; `tax` = `base` × `tax_rate` redondeado a 2 decimales; `total` = `base` + `tax`.
      required: [variant_id, product_id, product_name, quantity, unit_price, price_rule, tax_rate, discount, gross, base, tax, total]
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante.
        product_name:
          type: string
          description: Nombre del producto en el momento de la venta.
        variant_label:
          type: string
          description: |
            La variante en el momento de la venta: sus valores ordenados por nombre de eje (`Rojo · M`). No viene si
            la variante no tiene ejes, como la de un producto simple.
          example: Rojo · M
        quantity:
          $ref: "#/components/schemas/Quantity"
        unit_price:
          $ref: "#/components/schemas/Money"
        price_rule:
          type: string
          description: |
            ID estable de la regla de precio que dio `unit_price`: `variant_price` (el precio de la variante) o el de
            una regla de un módulo (por ejemplo, `price_lists`).
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          example: variant_price
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
        discount:
          $ref: "#/components/schemas/Money"
        gross:
          $ref: "#/components/schemas/Money"
        base:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
    SalePayment:
      type: object
      required: [method, amount]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          $ref: "#/components/schemas/Money"
    TaxBreakdown:
      type: object
      required: [rate, base, tax]
      properties:
        rate:
          $ref: "#/components/schemas/TaxRate"
        base:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
    SaleTotals:
      type: object
      description: |
        `subtotal` es la suma de los brutos de las líneas y `total` = `subtotal` − `discounts` + `tax`. `taxes`
        suma las bases y el IVA de las líneas por tasa, sin volver a redondear.
      required: [subtotal, discounts, tax, total, taxes]
      properties:
        subtotal:
          $ref: "#/components/schemas/Money"
        discounts:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        taxes:
          type: array
          description: IVA agrupado por tasa, de menor a mayor.
          items:
            $ref: "#/components/schemas/TaxBreakdown"
    SaleVoid:
      type: object
      required: [user_id, reason, voided_at]
      properties:
        user_id:
          type: string
          format: uuid
          description: Quién anuló.
        reason:
          type: string
        voided_at:
          type: string
          format: date-time
    Sale:
      type: object
      description: |
        Una venta confirmada o anulada. `change` es el cambio entregado en efectivo. `void` solo aparece en una
        venta anulada.
      required: [id, number, location_id, user_id, status, lines, payments, totals, paid, change, confirmed_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: Consecutivo de la venta en su sede.
        location_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Quién vendió.
        cash_session_id:
          type: string
          format: uuid
          description: La caja donde se cobró; no viene si se vendió sin caja.
        status:
          $ref: "#/components/schemas/SaleStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SaleLine"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/SalePayment"
        totals:
          $ref: "#/components/schemas/SaleTotals"
        paid:
          $ref: "#/components/schemas/Money"
        change:
          $ref: "#/components/schemas/Money"
        confirmed_at:
          type: string
          format: date-time
        void:
          $ref: "#/components/schemas/SaleVoid"
    SaleSummary:
      type: object
      required: [id, number, location_id, user_id, status, total, confirmed_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
        location_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SaleStatus"
        total:
          $ref: "#/components/schemas/Money"
        confirmed_at:
          type: string
          format: date-time
        voided_at:
          type: string
          format: date-time
    SalePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleSummary"
        total:
          type: integer
          description: Cantidad total de ventas que cumplen el filtro, sin paginar.
    SignedMoney:
      type: string
      description: Monto en pesos colombianos con signo, como decimal en string (hasta 4 decimales).
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      example: "-4800.00"
    OpenCashSessionInput:
      type: object
      required: [location_id, opening_float]
      additionalProperties: false
      properties:
        location_id:
          type: string
          format: uuid
          description: Sede de la caja; las ventas de la caja son de esta sede.
        opening_float:
          $ref: "#/components/schemas/Money"
    CashMovementKind:
      type: string
      enum: [in, out]
      description: "`in` es un ingreso de efectivo a la caja y `out` un egreso."
    CashMovementInput:
      type: object
      required: [kind, amount, reason]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/CashMovementKind"
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          minLength: 1
          maxLength: 200
          example: Pago del domicilio
    CashMovement:
      type: object
      required: [id, kind, amount, reason, user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CashMovementKind"
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    DenominationCount:
      type: object
      description: |
        Billetes o monedas contados de una denominación del peso colombiano: 100000, 50000, 20000, 10000, 5000, 2000,
        1000 (billete y moneda juntos), 500, 200, 100 o 50.
      required: [denomination, quantity]
      additionalProperties: false
      properties:
        denomination:
          $ref: "#/components/schemas/Money"
        quantity:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
    CloseCashSessionInput:
      type: object
      required: [counts]
      additionalProperties: false
      properties:
        counts:
          type: array
          description: Una entrada por denominación, sin repetir. Un conteo vacío es una caja sin efectivo.
          maxItems: 11
          items:
            $ref: "#/components/schemas/DenominationCount"
        notes:
          type: string
          maxLength: 500
    CashMethodTotal:
      type: object
      description: Lo que cobraron las ventas de la caja con un medio de pago; el efectivo es neto del cambio.
      required: [method, amount]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          $ref: "#/components/schemas/Money"
    CashClosing:
      type: object
      description: |
        El reporte de cierre. `expected` = base + `cash_received` + `cash_in` − `cash_out` − `change_given`, de las
        ventas confirmadas de la caja (las anuladas antes del cierre no cuentan); `difference` = `counted` −
        `expected`: negativa es faltante (`shortage`) y positiva, sobrante (`overage`).
      required: [closed_at, closed_by, sales_count, cash_received, change_given, cash_in, cash_out, expected, counted,
        difference, result, counts, payments]
      properties:
        closed_at:
          type: string
          format: date-time
        closed_by:
          type: string
          format: uuid
        notes:
          type: string
        sales_count:
          type: integer
          description: Ventas confirmadas de la caja.
        cash_received:
          $ref: "#/components/schemas/Money"
        change_given:
          $ref: "#/components/schemas/Money"
        cash_in:
          $ref: "#/components/schemas/Money"
        cash_out:
          $ref: "#/components/schemas/Money"
        expected:
          $ref: "#/components/schemas/SignedMoney"
        counted:
          $ref: "#/components/schemas/Money"
        difference:
          $ref: "#/components/schemas/SignedMoney"
        result:
          type: string
          enum: [exact, shortage, overage]
        counts:
          type: array
          description: El conteo, de la denominación más alta a la más baja.
          items:
            $ref: "#/components/schemas/DenominationCount"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/CashMethodTotal"
    CashSession:
      type: object
      description: Una caja. `closing` solo viene cuando está cerrada.
      required: [id, location_id, user_id, status, opening_float, opened_at, movements]
      properties:
        id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: El cajero.
        status:
          type: string
          enum: [open, closed]
        opening_float:
          $ref: "#/components/schemas/Money"
        opened_at:
          type: string
          format: date-time
        movements:
          type: array
          description: Ingresos y egresos, del más antiguo al más reciente.
          items:
            $ref: "#/components/schemas/CashMovement"
        closing:
          $ref: "#/components/schemas/CashClosing"
    CurrentCashSession:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: Si la empresa exige caja abierta para vender.
        session:
          $ref: "#/components/schemas/CashSession"
