    get:
      tags: [inventory]
      operationId: getVariantKardex
      summary: Kardex de una variante
      description: |
        Los movimientos de la variante, del más reciente al más antiguo. `balance_after` es el saldo en la sede
        del movimiento justo después de él. Una variante sin movimientos, o de otra empresa, tiene el kardex vacío.
      x-permission: inventory:read
      parameters:
        - name: location_id
          in: query
          description: Solo los movimientos de esta sede.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página del kardex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/locations/{locationId}/reorder-rules/{variantId}:
    parameters:
      - $ref: "#/components/parameters/LocationId"
      - $ref: "#/components/parameters/VariantId"
    put:
      tags: [inventory]
      operationId: setReorderRule
      summary: Definir el stock mínimo y máximo de una variante en una sede
      description: |
        Cuando la existencia de la variante en la sede llega al mínimo o baja de él, aparece en las alertas de
        reposición con la cantidad sugerida a pedir (máximo − existencia). Reemplaza los valores anteriores. Las
        cantidades van en la unidad base del producto.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRuleInput"
      responses:
        "200":
          description: La regla guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La sede (`location_not_found`) o la variante (`variant_not_found`) no existen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: El mínimo es negativo o mayor que el máximo (`invalid_reorder_range`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [inventory]
      operationId: deleteReorderRule
      summary: Quitar el stock mínimo y máximo de una variante en una sede
      description: La variante deja de aparecer en las alertas de reposición de la sede.
      x-permission: inventory:adjust
      responses:
        "204":
          description: La regla se quitó.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La variante no tiene stock mínimo en la sede (`reorder_rule_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/reorder-alerts:
    get:
      tags: [inventory]
      operationId: listReorderAlerts
      summary: Variantes por reponer
      description: |
        Las variantes cuya existencia en una sede está en su mínimo o por debajo, con la cantidad sugerida a pedir
        (máximo − existencia, nunca negativa), de la que está más por debajo de su mínimo a la que menos. Sin
        `location_id`, las de todas las sedes.
      x-permission: inventory:read
      parameters:
        - name: location_id
          in: query
          description: Solo las alertas de esta sede.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de alertas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderAlertPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: La sede no existe (`location_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/receipts:
    post:
      tags: [inventory]
      operationId: receiveStock
      summary: Registrar una entrada de mercancía
      description: |
        Suma la cantidad a la existencia de la sede y recalcula el costo promedio ponderado. Sirve también para el
        inventario inicial. Puede venir en una unidad alternativa de la variante (`unit_id`); el movimiento se guarda en
        la unidad base.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: El movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `invalid_unit_cost`, `variant_not_found`,
            `location_not_found`, `location_inactive`). Con `unit_id`, la variante no tiene esa unidad
            (`unit_not_available`) o la cantidad en unidad base necesita más de 4 decimales (`quantity_precision`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/adjustments:
    post:
      tags: [inventory]
      operationId: adjustStock
      summary: Registrar un ajuste de inventario
      description: |
        Corrige la existencia en la cantidad indicada (positiva suma, negativa resta) por un motivo obligatorio. Se
        valora al costo promedio y no lo cambia.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentInput"
      responses:
        "201":
          description: El movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No hay stock suficiente en la sede (`insufficient_stock`) y la empresa no permite stock negativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `adjustment_reason_required`,
            `adjustment_reason_too_long`, `variant_not_found`, `location_not_found`, `location_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/transfers:
    post:
      tags: [inventory]
      operationId: transferStock
      summary: Trasladar mercancía entre sedes
      description: |
        Saca la cantidad de la sede de origen y la entra en la de destino, valorada al costo promedio del origen.
        Los dos movimientos comparten la misma referencia de traslado.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Los dos movimientos del traslado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No hay stock suficiente en la sede (`insufficient_stock`) y la empresa no permite stock negativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `same_location_transfer`, `variant_not_found`,
            `location_not_found`, `location_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stock-counts:
    get:
      tags: [inventory]
      operationId: listStockCounts
      summary: Conteos físicos
      description: |
        Los conteos físicos de la empresa, del más reciente al más antiguo. Los aprobados traen su exactitud
        (`summary`); los valores de las diferencias solo se envían a quien puede ver costos.
      x-permission: inventory:count
      parameters:
        - name: location_id
          in: query
          description: Solo los conteos de esta sede.
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Solo los conteos en este estado.
          required: false
          schema:
            $ref: "#/components/schemas/StockCountStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de conteos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCountPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [inventory]
      operationId: startStockCount
      summary: Iniciar un conteo físico
      description: |
        Abre un conteo en una sede y toma la foto de su stock: de todas las variantes con existencia en la sede o,
        con `category_ids`, de las variantes de esas categorías y sus subcategorías. El negocio puede seguir vendiendo:
        lo esperado de cada variante descuenta los movimientos ocurridos hasta que se contó. Una sede tiene a lo sumo
        un conteo abierto.
      x-permission: inventory:count_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockCountInput"
      responses:
        "201":
          description: El conteo abierto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: La sede ya tiene un conteo abierto (`stock_count_in_progress`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            La sede no existe o está inactiva (`location_not_found`, `location_inactive`), o una categoría no existe
            (`category_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stock-counts/{stockCountId}:
    parameters:
      - $ref: "#/components/parameters/StockCountId"
    get:
      tags: [inventory]
      operationId: getStockCount
      summary: Un conteo físico
      description: El conteo con su avance. Nunca trae el stock esperado (el conteo es ciego).
      x-permission: inventory:count
      responses:
        "200":
          description: El conteo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StockCountNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stock-counts/{stockCountId}/entries:
    parameters:
      - $ref: "#/components/parameters/StockCountId"
    get:
      tags: [inventory]
      operationId: listCountEntries
      summary: Lo contado en un conteo
      description: |
        Lo que se ha contado en la ronda vigente de cada variante, del más reciente al más antiguo. Quien no administra
        conteos (`inventory:count_manage`) solo ve lo que contó él.
      x-permission: inventory:count
      parameters:
        - name: variant_id
          in: query
          description: Solo lo contado de esta variante.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de conteos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountEntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StockCountNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [inventory]
      operationId: recordCountEntry
      summary: Registrar lo contado de una variante
      description: |
        Varias personas pueden contar a la vez. Con `unit_id` la cantidad va en esa unidad alternativa de la variante
        y se guarda en la unidad base. En un conteo total se puede contar una variante que no estaba en la foto (entra
        con cero al inicio); en uno parcial, solo las de sus categorías.
      x-permission: inventory:count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountEntryInput"
      responses:
        "201":
          description: Lo contado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StockCountNotFound"
        "409":
          description: El conteo ya se aprobó o se canceló (`stock_count_not_open`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            La variante no existe o no está en el conteo (`variant_not_found`, `variant_not_in_count`), la unidad no
            es de la variante (`unit_not_available`) o la cantidad no es válida (`invalid_quantity`,
            `quantity_precision`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stock-counts/{stockCountId}/entries/{countEntryId}:
    parameters:
      - $ref: "#/components/parameters/StockCountId"
      - $ref: "#/components/parameters/CountEntryId"
    delete:
      tags: [inventory]
      operationId: deleteCountEntry
      summary: Borrar algo contado
      description: Corrige un error mientras el conteo está abierto. Cada quien borra lo suyo; quien administra conteos, cualquiera.
      x-permission: inventory:count
      responses:
        "204":
          description: Se borró.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Lo contó otra persona (`count_entry_not_yours`) o falta el permiso (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El conteo (`stock_count_not_found`) o lo contado (`count_entry_not_found`) no existen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El conteo ya se aprobó o se canceló (`stock_count_not_open`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stock-counts/{stockCountId}/lines:
    parameters:
      - $ref: "#/components/parameters/StockCountId"
    get:
      tags: [inventory]
      operationId: listStockCountLines
      summary: Diferencias de un conteo
      description: |
        Cada variante del conteo con lo esperado (stock al inicio más entradas menos salidas hasta que se contó), lo
        contado y la diferencia: primero las que están en revisión y luego las de mayor diferencia en valor. `summary`
        resume todas las líneas. Los valores solo se envían a quien puede ver costos.
      x-permission: inventory:count_manage
      parameters:
        - name: status
          in: query
          description: Solo las líneas en este estado.
          required: false
          schema:
            $ref: "#/components/schemas/StockCountLineStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de líneas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCountLinePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StockCountNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stock-counts/{stockCountId}/recount:
    parameters:
      - $ref: "#/components/parameters/StockCountId"
    post:
      tags: [inventory]
      operationId: requestRecount
      summary: Pedir el recuento de variantes dudosas
      description: Lo contado hasta ahora de esas variantes deja de valer y se cuentan de nuevo.
      x-permission: inventory:count_manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecountInput"
      responses:
        "204":
          description: Las variantes quedaron por contar.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StockCountNotFound"
        "409":
          description: El conteo ya se aprobó o se canceló (`stock_count_not_open`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Una variante no está en el conteo (`variant_not_in_count`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stock-counts/{stockCountId}/approve:
    parameters:
      - $ref: "#/components/parameters/StockCountId"
    post:
      tags: [inventory]
      operationId: approveStockCount
      summary: Aprobar un conteo
      description: |
        Cierra el conteo y registra un ajuste (motivo «Conteo físico», con referencia al conteo) por cada variante
        con diferencia, todos o ninguno. Las variantes sin contar no se ajustan. Los ajustes siguen la regla de stock
        negativo de la empresa.
      x-permission: inventory:count_manage
      responses:
        "200":
          description: El conteo aprobado, con su exactitud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StockCountNotFound"
        "409":
          description: |
            El conteo ya se cerró (`stock_count_not_open`), tiene variantes en revisión (`stock_count_needs_review`) o
            un ajuste dejaría el stock negativo (`insufficient_stock`, con `details.variant_id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stock-counts/{stockCountId}/cancel:
    parameters:
      - $ref: "#/components/parameters/StockCountId"
    post:
      tags: [inventory]
      operationId: cancelStockCount
      summary: Cancelar un conteo
      description: Cierra el conteo sin ajustar el stock.
      x-permission: inventory:count_manage
      responses:
        "200":
          description: El conteo cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StockCountNotFound"
        "409":
          description: El conteo ya se cerró (`stock_count_not_open`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Buscar clientes
      description: |
        Lista los clientes de la empresa. Con `q` busca por nombre o nombre comercial (cada palabra debe aparecer, sin
        importar tildes ni mayúsculas) o por el número de documento, que sale primero si coincide exacto. Sin `q`,
        ordena por nombre. Es la búsqueda del POS. Una venta sin cliente es a consumidor final: no hay un cliente
        guardado con ese nombre.
      x-permission: customers:read
      parameters:
        - name: q
          in: query
          description: Texto a buscar.
          required: false
          schema:
            type: string
            maxLength: 100
          example: gómez
        - name: segment_id
          in: query
          description: Solo los clientes de este segmento.
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Clientes activos (por defecto), inactivos o todos.
          required: false
          schema:
            type: string
            enum: [active, inactive, all]
            default: active
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de clientes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Crear un cliente
      description: |
        Crea un cliente. También se usa desde el POS para crearlo al vuelo. El documento es único en la
        empresa por tipo y número.
      x-permission: customers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Cliente creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe un cliente con ese documento (`customer_document_taken`); el mensaje dice cuál.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidCustomer"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Ver un cliente
      x-permission: customers:read
      responses:
        "200":
          description: El cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Editar un cliente
      description: |
        Reemplaza los datos del cliente. Un cliente no se borra: se desactiva (`active: false`) y deja de aparecer en
        la búsqueda del POS, pero sus ventas lo siguen nombrando.
      x-permission: customers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: El cliente actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ya existe otro cliente con ese documento (`customer_document_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidCustomer"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/customer-segments:
