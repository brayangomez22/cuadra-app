    put:
      tags: [catalog]
      operationId: updateAttribute
      summary: Editar un atributo de producto
      description: |
        Cambia la etiqueta, las opciones y si es obligatorio. La clave y el tipo no cambian, porque los productos
        guardan sus valores con esa clave. No se puede quitar una opción que tiene algún producto. Si el atributo
        pasa a ser obligatorio, los productos que no lo tienen deben llenarlo la próxima vez que se editen.
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDefinitionUpdate"
      responses:
        "200":
          description: El atributo actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
        "400":
