openapi: 3.0.3
info:
  title: Cuadra API
  version: 0.1.0
  description: |
    API de Cuadra, el SaaS de gestión para pymes.

    Convenciones:
    - Los endpoints de negocio viven bajo `/api/v1` y requieren un token Bearer (JWT).
    - Los errores siempre usan el esquema `Error`: `{"error": {"code": "...", "message": "..."}}`.
      `code` es estable y legible por máquina; `message` está en español y se puede mostrar al usuario.
    - El dinero y las cantidades viajan como strings decimales (`"12500.00"`), nunca como números.
    - La paginación usa `limit` (máximo 100) y `offset`.
    - Las fechas van en RFC 3339, en UTC.
servers:
  - url: http://localhost:8080
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: health
    description: Probes de liveness y readiness. No requieren autenticación.
  - name: auth
    description: |
      Registro, inicio de sesión y sesión del usuario.

      El access token (JWT) dura 15 minutos y se envía en `Authorization: Bearer`. El refresh token
      viaja solo en la cookie `cuadra_refresh` (HttpOnly, Secure, SameSite=Strict, ruta `/api/v1/auth`),
      rota en cada uso y su reutilización cierra todas las sesiones de esa familia.
  - name: catalog
    description: |
      Productos y categorías de la empresa. El dinero viaja como string decimal y el precio no incluye IVA.
  - name: inventory
    description: |
      Sedes, existencias y kardex. El stock es de cada variante (`variant_id`); `product_id` queda por compatibilidad
      y se resuelve a la variante por defecto del producto. Las cantidades están en la unidad base del producto y
      viajan como string decimal. Cada cambio de stock queda como un movimiento inmutable del kardex. Los costos (`average_cost`, `unit_cost`,
      `average_cost_after`) solo se envían a quien puede editar el catálogo (`catalog:write`).
  - name: sales
    description: |
      Ventas del punto de venta. El precio, el nombre y el IVA de cada línea salen del catálogo en el momento de la
      venta; el cliente solo envía producto, cantidad, descuento y pagos. Los montos viajan como string decimal con
      2 decimales. Cada venta confirmada recibe un consecutivo por sede, sin huecos.
  - name: modules
    description: |
      Módulos que la empresa puede activar según su tipo de negocio (variantes, lotes, listas de precios...). Las
      operaciones de un módulo inactivo responden 404, y sus permisos no aparecen en `/me`. Desactivar un módulo no
      borra sus datos.
  - name: cash
    description: |
      Caja del cajero: apertura con base, ingresos y egresos con motivo, y cierre con arqueo por denominación. Cada
      usuario tiene como máximo una caja abierta, en una sede, y las ventas que confirma quedan en ella. Por defecto no
      se puede vender sin caja abierta. El arqueo es ciego: el esperado y la diferencia solo aparecen en el cierre.

# Authorization is declared here and enforced by the API before the request
# is validated: every operation requires a bearer token unless it says
# `security: []`, and `x-permission` names the permission the user's role
# must grant (see the permission matrix of the identity module). `x-module`
# names the activable module an operation belongs to: when the tenant does
# not have it active, the operation answers 404 (after the token and the
# permission are checked, before the request is validated).

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness
      description: El proceso está vivo. No revisa dependencias.
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness
      description: Las dependencias (base de datos) responden y la instancia puede recibir tráfico.
      security: []
      responses:
        "200":
          description: La instancia está lista.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Alguna dependencia no responde (`code` = `not_ready`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Registrar una empresa
      description: Crea la empresa (tenant) y su usuario dueño, e inicia la sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Empresa creada; la sesión queda iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_email`, `invalid_nit`, `invalid_nit_check_digit`,
            `password_too_short`, `password_too_long`, `invalid_tenant_name`, `invalid_user_name`,
            `unknown_business_template`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/business-templates:
    get:
      tags: [auth]
      operationId: listBusinessTemplates
      summary: Listar las plantillas de tipo de negocio
      description: |
        Las plantillas que se pueden elegir al registrar una empresa. Cada una siembra unidades,
        categorías, atributos de producto, ejes de variante y módulos; después la empresa puede
        cambiarlo todo.
      security: []
      responses:
        "200":
          description: Las plantillas, en el orden en que se presentan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTemplateList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión
      description: |
        Si el correo y la contraseña coinciden en varias empresas, responde 409 con la lista de
        empresas; el cliente repite la request con el `tenant_id` elegido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Correo o contraseña incorrectos (`code` = `invalid_credentials`). No revela si el correo existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La empresa está suspendida (`code` = `tenant_suspended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Las credenciales son válidas en varias empresas (`code` = `tenant_selection_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSelectionRequired"
        "429":
          description: Demasiados intentos (`code` = `too_many_requests`).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de intentar de nuevo.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renovar la sesión
      description: Cambia el refresh token de la cookie por uno nuevo y emite un access token nuevo.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          description: Sesión renovada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Falta la cookie, o el refresh token no es válido, venció o fue reutilizado (`code` = `invalid_session`).
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión
      description: Revoca el refresh token de la cookie (y su familia) y borra la cookie. Es idempotente.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuario actual
      description: El usuario autenticado, su empresa y sus permisos.
      responses:
        "200":
          description: El usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/modules:
    get:
      tags: [modules]
      operationId: listModules
      summary: Listar los módulos
      description: Todos los módulos disponibles, con sus dependencias y si la empresa los tiene activos.
      x-permission: tenant:manage
      responses:
        "200":
          description: Los módulos, en el orden en que se presentan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/modules/{moduleId}:
    parameters:
      - $ref: "#/components/parameters/ModuleId"
    put:
      tags: [modules]
      operationId: setModuleActive
      summary: Activar o desactivar un módulo
      description: |
        Activa o desactiva un módulo para la empresa. Es idempotente: activar un módulo activo no cambia nada.
        Un módulo solo se activa con sus dependencias activas, y no se desactiva mientras otro módulo activo
        dependa de él. Desactivarlo no borra sus datos: vuelven a estar disponibles al activarlo de nuevo.
      x-permission: tenant:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleUpdate"
      responses:
        "200":
          description: El módulo con su estado nuevo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El módulo no existe (`unknown_module`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Una dependencia del módulo está inactiva (`module_dependency_inactive`) o un módulo activo depende de
            él (`module_required_by`). El módulo que bloquea el cambio va en `details.module`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Buscar productos
      description: |
        Lista los productos de la empresa, cada uno con sus variantes. Con `q` busca por nombre (cada palabra
        debe aparecer, sin importar tildes ni mayúsculas) o por el SKU o el código de barras exactos de
        cualquiera de sus variantes, que salen primero. Sin `q`, ordena por nombre.

        Es la búsqueda del POS: con `q`, la request se mide con `cuadra.operation=pos.search` (SLO de latencia).
      x-permission: catalog:read
      parameters:
        - name: q
          in: query
          description: Texto a buscar.
          required: false
          schema:
            type: string
            maxLength: 100
          example: cinta
        - name: category_id
          in: query
          description: Solo los productos de esta categoría.
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Productos activos (por defecto), inactivos o todos.
          required: false
          schema:
            type: string
            enum: [active, inactive, all]
            default: active
        - name: ids
          in: query
          description: |
            Solo estos productos (hasta 100), por ejemplo los de una página de existencias. Se combina con los demás
            filtros: para traer también los inactivos, use `status=all`.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de productos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Crear un producto
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Producto creado (activo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: El SKU o el código de barras ya existen en la empresa (`sku_taken`, `barcode_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_sku`, `invalid_barcode`, `invalid_product_name`,
            `invalid_description`, `invalid_price`, `invalid_cost`, `invalid_tax_rate`, `category_not_found`), falta
            la unidad o vienen las dos formas de indicarla (`unit_required`), la unidad no existe en la empresa
            (`unit_not_found`), o un atributo no está definido (`unknown_attribute`), no tiene un valor válido
            (`invalid_attribute_value`) o es obligatorio y falta (`attribute_required`). Los errores de un atributo
            lo nombran en `details.attribute`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Ver un producto
      description: Devuelve el producto aunque esté inactivo.
      x-permission: catalog:read
      responses:
        "200":
          description: El producto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [catalog]
      operationId: updateProduct
      summary: Editar un producto
      description: Reemplaza todos los datos editables. El precio de un producto inactivo no se puede cambiar.
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: El producto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El SKU o el código de barras ya existen en la empresa (`sku_taken`, `barcode_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (los mismos códigos de crear un producto) o se cambió el precio
            de un producto inactivo (`product_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [catalog]
      operationId: deactivateProduct
      summary: Desactivar un producto
      description: El producto deja de venderse, pero se conserva para el historial. Es idempotente.
      x-permission: catalog:write
      responses:
        "200":
          description: El producto, inactivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}/activate:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [catalog]
      operationId: activateProduct
      summary: Activar un producto
      description: El producto se puede vender de nuevo. Es idempotente.
      x-permission: catalog:write
      responses:
        "200":
          description: El producto, activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}/variants:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [catalog]
      operationId: addProductVariant
      summary: Agregar una variante a un producto
      description: |
        Agrega una variante activa. Debe usar los mismos ejes que las demás variantes del producto, con valores
        distintos. A un producto simple primero se le asignan ejes a su variante por defecto (editar la variante).
        Requiere el módulo `variants` activo; si no lo está, responde 404.
      x-permission: catalog:write
      x-module: variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVariantInput"
      responses:
        "201":
          description: El producto con la variante nueva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El SKU o el código de barras ya existen en la empresa (`sku_taken`, `barcode_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_sku`, `invalid_barcode`, `invalid_price`, `invalid_cost`,
            `invalid_axis_values`), un eje no está definido en la empresa (`unknown_axis`) o no admite el valor
            (`axis_value_not_allowed`), con el eje en `details.axis`, los ejes no son los de las demás variantes
            (`variant_axes_mismatch`) u otra variante ya tiene esos valores (`duplicate_variant`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}/variants/{variantId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/VariantId"
    put:
      tags: [catalog]
      operationId: updateProductVariant
      summary: Editar una variante
      description: |
        Reemplaza los datos editables de la variante y su estado. El precio de una variante de un producto
        inactivo no se puede cambiar. Una variante inactiva no se vende aunque el producto esté activo.
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVariantUpdate"
      responses:
        "200":
          description: El producto con la variante actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El SKU o el código de barras ya existen en la empresa (`sku_taken`, `barcode_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (los mismos códigos de agregar una variante) o se cambió el precio
            de una variante de un producto inactivo (`product_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Listar categorías
      description: Todas las categorías de la empresa, ordenadas por nombre. El árbol se arma con `parent_id`.
      x-permission: catalog:read
      responses:
        "200":
          description: Las categorías.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [catalog]
      operationId: createCategory
      summary: Crear una categoría
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoría creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: El nombre no es válido (`invalid_category_name`) o el padre no existe (`category_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
