  /api/v1/sales:
    get:
      tags: [sales]
      operationId: listSales
      summary: Ventas del día
      description: |
        Las ventas confirmadas (y las anuladas) de un día en hora de Colombia (`America/Bogota`), de la más reciente
        a la más antigua. Sin `date`, el día de hoy.
      x-permission: sales:read
      parameters:
        - name: date
          in: query
          description: Día en hora de Colombia (`YYYY-MM-DD`).
          required: false
          schema:
            type: string
            format: date
        - name: location_id
          in: query
          description: Solo las ventas de esta sede.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de ventas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [sales]
      operationId: confirmSale
      summary: Confirmar una venta
      description: |
        Cobra el carrito completo en una sola operación: arma la venta con los precios del catálogo, valida los
        descuentos contra el tope del usuario y los pagos contra el total, registra las salidas de inventario y le
        asigna el consecutivo de la sede. Si algo falla, no se guarda nada.

        Solo el efectivo da cambio. Quien no tiene `sales:discount` descuenta hasta el tope que fijó la empresa
        (por defecto, 0 %).
      x-permission: sales:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSaleInput"
      responses:
        "201":
          description: La venta confirmada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            El usuario no tiene permiso (`forbidden`) o un descuento supera su tope (`discount_exceeds_limit`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            No hay stock suficiente de una variante (`insufficient_stock`); `details.variant_id` dice cuál. El
            usuario no tiene caja abierta y la empresa la exige (`cash_session_required`), o la caja se cerró
            (`cash_session_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`product_not_found` y `product_inactive`, también para una
            variante; `customer_not_found`, `customer_inactive`, `location_not_found`, `location_inactive`, `insufficient_payment`, `non_cash_overpayment`, `invalid_quantity`,
            `invalid_discount`, `invalid_payment_amount`, `sale_without_lines`, `cash_session_location_mismatch`). Una
            línea en una unidad que la variante no tiene (`unit_not_available`) o cuya cantidad en unidad base necesita
            más de 4 decimales (`quantity_precision`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sales/discount-limit:
    get:
      tags: [sales]
      operationId: getDiscountLimit
      summary: Tope de descuento del usuario
      description: |
        Cuánto puede descontar el usuario autenticado en cada línea, para que el POS muestre u oculte el campo de
        descuento. Quien tiene `sales:discount` no tiene tope (`unlimited`); los demás tienen el que fijó la
        empresa (por defecto, 0 %). La API vuelve a aplicar el tope al confirmar la venta.
      x-permission: sales:create
      responses:
        "200":
          description: El tope del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sales/{saleId}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [sales]
      operationId: getSale
      summary: Detalle de una venta
      x-permission: sales:read
      responses:
        "200":
          description: La venta con sus líneas, pagos y totales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La venta no existe (`sale_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sales/{saleId}/void:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    post:
      tags: [sales]
      operationId: voidSale
      summary: Anular una venta
      description: |
        Anula una venta confirmada y devuelve al inventario exactamente lo que salió, con movimientos `sale_void`.
        La venta conserva su consecutivo. Una venta anulada no se puede volver a anular.
      x-permission: sales:void
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidSaleInput"
      responses:
        "200":
          description: La venta anulada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La venta no existe (`sale_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La venta no está confirmada; por ejemplo, ya fue anulada (`sale_not_confirmed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Falta el motivo o es muy largo (`invalid_void_reason`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/cash-sessions:
    post:
      tags: [cash]
      operationId: openCashSession
      summary: Abrir la caja
      description: Abre la caja del usuario autenticado en una sede, con la base inicial en efectivo.
      x-permission: sales:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCashSessionInput"
      responses:
        "201":
          description: La caja abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: El usuario ya tiene una caja abierta (`cash_session_already_open`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: La sede no existe (`location_not_found`) o la base no es válida (`invalid_opening_float`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cash-sessions/current:
    get:
      tags: [cash]
      operationId: getCurrentCashSession
      summary: Caja actual del usuario
      description: |
        Si la empresa exige caja abierta para vender (`required`) y la caja abierta del usuario autenticado, con sus
        movimientos. Sin caja abierta, `session` no viene.
      x-permission: sales:create
      responses:
        "200":
          description: La caja actual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCashSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cash-sessions/{cashSessionId}:
    parameters:
      - $ref: "#/components/parameters/CashSessionId"
    get:
      tags: [cash]
      operationId: getCashSession
      summary: Detalle de una caja
      description: La caja con sus movimientos y, si está cerrada, el reporte de cierre.
      x-permission: sales:read
      responses:
        "200":
          description: La caja.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La caja no existe (`cash_session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cash-sessions/{cashSessionId}/movements:
    parameters:
      - $ref: "#/components/parameters/CashSessionId"
    post:
      tags: [cash]
      operationId: recordCashMovement
      summary: Registrar un ingreso o egreso de caja
      description: Registra un ingreso o un egreso de efectivo con su motivo en la caja abierta del usuario.
      x-permission: sales:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashMovementInput"
      responses:
        "201":
          description: El movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashMovement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            El usuario no tiene permiso (`forbidden`) o la caja es de otro usuario (`cash_session_not_owner`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La caja no existe (`cash_session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La caja está cerrada (`cash_session_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            El monto o el motivo no son válidos (`invalid_cash_movement_amount`, `invalid_cash_movement_reason`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cash-sessions/{cashSessionId}/close:
    parameters:
      - $ref: "#/components/parameters/CashSessionId"
    post:
      tags: [cash]
      operationId: closeCashSession
      summary: Cerrar la caja con arqueo
      description: |
        Cierra la caja del usuario con el conteo del efectivo por denominación. La API calcula el esperado (base +
        efectivo recibido + ingresos − egresos − cambio entregado, de las ventas confirmadas de la caja) y la
        diferencia con lo contado. El cierre no se puede modificar después.
      x-permission: sales:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseCashSessionInput"
      responses:
        "200":
          description: La caja cerrada, con el reporte de cierre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            El usuario no tiene permiso (`forbidden`) o la caja es de otro usuario (`cash_session_not_owner`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La caja no existe (`cash_session_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La caja ya está cerrada (`cash_session_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            El conteo no es válido (`invalid_denomination`, `invalid_denomination_quantity`,
            `duplicate_denomination`) o las notas son muy largas (`invalid_cash_notes`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/imports:
    post:
      tags: [imports]
      operationId: uploadImport
      summary: Subir un archivo de importación
      description: |
        Lee y valida el archivo sin escribir nada en el catálogo: cada fila contra las columnas de la empresa y cada
        producto contra el catálogo. El formato sale de la extensión del archivo (`.xlsx` o `.csv`; un `.csv` puede
        separar con `;` y usar coma decimal, o con `,` y punto decimal). Sin errores, la importación queda
        `validated` y se puede confirmar; con alguno, `rejected` (corrija el archivo y vuelva a subirlo). La
        respuesta trae los primeros 50 errores y los primeros 10 productos.
      x-permission: imports:run
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: La importación, validada o rechazada, con su previsualización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: El archivo pasa de 10 MB (`file_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            La sede no existe o está inactiva (`location_not_found`), el archivo no es `.xlsx` ni `.csv`
            (`unsupported_format`) o no se puede leer (`unreadable_file`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/import-template:
    get:
      tags: [imports]
      operationId: getImportTemplate
      summary: Descargar la plantilla de importación
      description: |
        Un archivo vacío con las columnas de la empresa. El `.xlsx` trae además una hoja de ayuda con las unidades,
        las opciones de los atributos de lista y los valores de los ejes.
      x-permission: imports:run
      parameters:
        - name: format
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ImportFormat"
      responses:
        "200":
          description: La plantilla.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [imports]
      operationId: getImport
      summary: Ver una importación
      description: Su estado y sus conteos. Mientras corre (`queued`, `running`) los conteos avanzan por lotes.
      x-permission: imports:run
      responses:
        "200":
          description: La importación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/imports/{importId}/confirm:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [imports]
      operationId: confirmImport
      summary: Confirmar una importación
      description: |
        Pone en cola una importación `validated`; un trabajo en segundo plano la escribe por lotes. Si un lote falla
        al escribirse, se deshace ese lote, la importación queda `failed` con su error y los lotes anteriores se
        conservan: al volver a subir el archivo con `on_existing_sku=update` se completa.
      x-permission: imports:run
      responses:
        "200":
          description: La importación en cola.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La importación no está validada (`import_not_validated`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/imports/{importId}/errors:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [imports]
      operationId: listImportErrors
      summary: Errores de una importación
      description: Los errores de sus filas, por número de fila (se guardan los primeros 1.000; `total` los cuenta todos).
      x-permission: imports:run
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de errores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  headers:
    SetRefreshCookie:
      description: |
        Cookie `cuadra_refresh` con el refresh token (HttpOnly, Secure, SameSite=Strict, ruta `/api/v1/auth`).
        Al cerrar sesión o si la sesión no es válida, la cookie se borra.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: Cantidad máxima de resultados.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Cantidad de resultados a saltar.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
      example: variants
    StockCountId:
      name: stockCountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CountEntryId:
      name: countEntryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttributeId:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SegmentId:
      name: segmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AxisId:
      name: axisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CashSessionId:
      name: cashSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefreshCookie:
      name: cuadra_refresh
      in: cookie
      description: Refresh token. Lo pone la API; el navegador lo envía solo a `/api/v1/auth`.
      required: false
      schema:
        type: string
        maxLength: 200

  responses:
    BadRequest:
      description: La request no cumple el contrato (`code` = `invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Falta el token o no es válido (`code` = `unauthorized`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: El usuario no tiene permiso para esta acción (`code` = `forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StockCountNotFound:
      description: El conteo no existe (`stock_count_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidCustomer:
      description: |
        Algún dato del cliente no cumple las reglas: el tipo de persona (`invalid_person_type`), el documento no es
        válido para su tipo (`invalid_document`), el
        dígito de verificación del NIT no coincide (`invalid_nit_check_digit`), una persona jurídica sin NIT
        (`legal_person_requires_nit`), el nombre (`invalid_customer_name`), un dato de contacto (`invalid_customer_contact`),
        las responsabilidades fiscales (`invalid_tax_responsibilities`) o un segmento que no existe
        (`customer_segment_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: El recurso no existe (`code` = `not_found` u otro más específico).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        La operación choca con el estado actual (por ejemplo, un SKU duplicado o `insufficient_stock`: no hay stock
        suficiente).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: La request es válida, pero viola una regla de negocio (por ejemplo, `invalid_quantity`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Error inesperado del servidor (`code` = `internal_error`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      example:
        error:
          code: insufficient_stock
          message: No hay stock suficiente de Producto X
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable, en snake_case, para que el cliente decida qué hacer.
        message:
          type: string
          description: Mensaje en español que se puede mostrar al usuario.
        details:
          type: object
          description: |
            Datos del error para el cliente, solo en los códigos que lo documentan (por ejemplo, `variant_id` en
            `insufficient_stock`, o el código que choca en `details.sku` de `sku_taken` y `details.barcode` de
            `barcode_taken`). Nunca trae datos personales.
          additionalProperties:
            type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    SignUpRequest:
      type: object
      required: [tenant_name, nit, name, email, password, business_template]
      additionalProperties: false
      properties:
        tenant_name:
          type: string
          description: Nombre de la empresa.
          minLength: 1
          maxLength: 200
          example: Mi Negocio
        nit:
          type: string
          description: NIT con dígito de verificación (`900123456-8`).
          minLength: 2
          maxLength: 20
          example: 900123456-8
        name:
          type: string
          description: Nombre del dueño.
          minLength: 1
          maxLength: 200
          example: Ana Gómez
        email:
          type: string
          minLength: 3
          maxLength: 254
          example: ana@minegocio.co
        password:
          type: string
          description: Entre 8 y 72 caracteres.
          format: password
          minLength: 8
          maxLength: 72
        business_template:
          type: string
          description: |
            Plantilla de tipo de negocio (`GET /api/v1/business-templates`). Siembra las unidades,
            categorías, atributos, ejes de variante, módulos e IVA por defecto de la empresa.
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          example: generica
    BusinessTemplate:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
          example: generica
        name:
          type: string
          example: Negocio general
        description:
          type: string
    BusinessTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BusinessTemplate"
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
        tenant_id:
          type: string
          format: uuid
          description: Empresa elegida tras una respuesta 409 `tenant_selection_required`.
    AuthSession:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: "JWT para el header `Authorization: Bearer`."
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Segundos de vida del access token.
          example: 900
        user:
          $ref: "#/components/schemas/Me"
    Me:
      type: object
      required: [id, tenant_id, tenant_name, tenant_nit, business_template, default_tax_rate, name, email, role, permissions, modules]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        tenant_nit:
          type: string
          description: NIT de la empresa con dígito de verificación, para la tirilla y los documentos.
          example: 900123456-8
        business_template:
          type: string
          description: Plantilla de tipo de negocio con la que se registró la empresa.
          example: generica
        default_tax_rate:
          allOf:
            - $ref: "#/components/schemas/TaxRate"
          description: |
            La tasa de IVA que se propone a un producto nuevo. La siembra la plantilla de la empresa y se cambia con
            `PATCH /api/v1/tenant`.
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, cashier, warehouse]
        permissions:
          type: array
          description: |
            Permisos del rol, para mostrar u ocultar acciones en la UI. Incluye los de los módulos activos.
          items:
            type: string
          example: [catalog:read, sales:create]
        modules:
          type: array
          description: Módulos activos de la empresa, para mostrar u ocultar menús, columnas y campos.
          items:
            type: string
          example: [variants]
    Tenant:
      type: object
      required: [id, name, nit, business_template, default_tax_rate]
      description: La empresa (tenant) y su configuración.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nit:
          type: string
          example: 900123456-8
        business_template:
          type: string
          example: generica
        default_tax_rate:
          $ref: "#/components/schemas/TaxRate"
    TenantUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        default_tax_rate:
          allOf:
            - $ref: "#/components/schemas/TaxRate"
          description: La tasa de IVA que se propone a un producto nuevo. No cambia la de los productos que ya existen.
    TenantSelectionRequired:
      type: object
      required: [error, tenants]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantOption"
    TenantOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Money:
      type: string
      description: Monto en pesos colombianos, como decimal en string (hasta 4 decimales).
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      example: "12500.00"
    TaxRate:
      type: string
      description: Tasa de IVA como fracción decimal (`0.19` es 19 %), menor que 1 y con hasta 4 decimales.
      pattern: '^0(\.\d{1,4})?$'
      example: "0.19"
    UnitOfMeasure:
      type: object
      required: [id, code, name]
      description: Una unidad de medida de la empresa, en la que se cuentan y se venden sus productos.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Lo que se muestra junto a una cantidad ("2,5 m"). Único en la empresa, en minúsculas.
          example: m
        name:
          type: string
          example: Metro
    UnitInput:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Único en la empresa, sin espacios. Se guarda en minúsculas.
          minLength: 1
          maxLength: 16
          example: par
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Par
    Module:
      type: object
      required: [id, name, depends_on, active]
      properties:
        id:
          type: string
          example: variants
        name:
          type: string
          example: Variantes
        depends_on:
          type: array
          description: Módulos que deben estar activos para activar este.
          items:
            type: string
        active:
          type: boolean
    ModuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Module"
    ModuleUpdate:
      type: object
      required: [active]
      additionalProperties: false
      properties:
        active:
          type: boolean
    UnitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UnitOfMeasure"
    AttributeType:
      type: string
      enum: [text, number, list, boolean]
      description: |
        El tipo de valor del atributo: texto libre (`text`), número decimal (`number`), una opción de una lista
        (`list`) o sí/no (`boolean`).
    AttributeDefinition:
      type: object
      required: [id, key, label, type, options, required]
      description: Un atributo que la empresa define para sus productos (marca, material, principio activo...).
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: La clave con la que los productos guardan el valor. No cambia.
          example: marca
        label:
          type: string
          example: Marca
        type:
          $ref: "#/components/schemas/AttributeType"
        options:
          type: array
          description: Las opciones de un atributo de lista, en su orden; vacío para los demás tipos.
          items:
            type: string
        required:
          type: boolean
          description: Si todo producto debe tener un valor.
    AttributeDefinitionInput:
      type: object
      required: [key, label, type, required]
      additionalProperties: false
      properties:
        key:
          type: string
          description: Minúsculas sin tildes, números y `_`, empezando por una letra. No se puede cambiar después.
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 50
          example: principio_activo
        label:
          type: string
          minLength: 1
          maxLength: 100
          example: Principio activo
        type:
          $ref: "#/components/schemas/AttributeType"
        options:
          $ref: "#/components/schemas/AttributeOptions"
        required:
          type: boolean
    AttributeDefinitionUpdate:
      type: object
      required: [label, required]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        options:
          $ref: "#/components/schemas/AttributeOptions"
        required:
          type: boolean
    AttributeOptions:
      type: array
      description: |
        Obligatorias para un atributo de lista y prohibidas para los demás. Sin repetir (sin importar las mayúsculas).
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 100
    AttributeDefinitionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttributeDefinition"
    AttributeValue:
      description: |
        Un texto para los atributos de texto, número y lista (un número va como texto decimal, `"2.5"`, nunca como
        número JSON) o un booleano para los de sí/no.
      x-go-type: interface{}
      oneOf:
        - type: string
          maxLength: 500
        - type: boolean
    ProductAttributes:
      type: object
      description: |
        Los valores del producto para los atributos de la empresa, por clave. Cada valor se valida contra la
        definición de su atributo.
      additionalProperties:
        $ref: "#/components/schemas/AttributeValue"
      example: {"marca": "Acme", "importado": true}
    VariantAxis:
      type: object
      required: [id, name, values]
      description: Un eje en el que varían las variantes de la empresa (color, tamaño, presentación...) y sus valores.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: En minúsculas. Es el nombre del eje en `axis_values` y no cambia.
          example: color
        values:
          type: array
          description: Los valores que admite el eje, en su orden.
          items:
            type: string
          example: [Rojo, Azul]
    VariantAxisInput:
      type: object
      required: [name, values]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Único en la empresa. Se guarda en minúsculas.
          minLength: 1
          maxLength: 50
          example: Color
        values:
          $ref: "#/components/schemas/VariantAxisValues"
    VariantAxisUpdate:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          $ref: "#/components/schemas/VariantAxisValues"
    VariantAxisValues:
      type: array
      description: Al menos un valor, sin repetir (sin importar las mayúsculas).
      minItems: 1
      maxItems: 200
      items:
        type: string
        minLength: 1
        maxLength: 100
    VariantAxisList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VariantAxis"
    ProductInput:
      type: object
      description: |
        Los datos del producto y los de su variante por defecto (`sku`, `barcode`, `cost` y `price`). Las demás
        variantes se editan con `/products/{productId}/variants`. Los atributos se validan contra las definiciones
        de la empresa (`/product-attributes`).
      required: [sku, name, base_unit_id, cost, price, tax_rate, attributes]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Código interno de la variante por defecto, único en la empresa. Se guarda en mayúsculas.
          minLength: 1
          maxLength: 64
          example: CIN-18
        barcode:
          type: string
          description: Código de barras, único en la empresa. Vacío u omitido si no tiene.
          maxLength: 64
          example: "7701234567890"
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Cinta adhesiva transparente 18 mm
        description:
          type: string
          maxLength: 2000
        category_id:
          type: string
          format: uuid
          nullable: true
        base_unit_id:
          type: string
          format: uuid
          description: La unidad de medida en la que se cuenta y se vende el producto.
        cost:
          $ref: "#/components/schemas/Money"
        price:
          $ref: "#/components/schemas/Money"
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
        attributes:
          allOf:
            - $ref: "#/components/schemas/ProductAttributes"
          description: |
            Los valores de los atributos de la empresa (`{}` si no tiene). Al editar reemplazan los que tiene el
            producto: un atributo que no se envía queda sin valor.
    AxisValues:
      type: object
      description: |
        El valor de la variante en cada eje que define la empresa (`{"color": "Azul"}`, ver `/variant-axes`), hasta
        5 ejes. Los nombres de los ejes se guardan en minúsculas y cada valor como lo escribe su eje ("azul" se
        guarda "Azul"). Vacío en la variante de un producto simple.
      maxProperties: 5
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 100
      example: {"color": "Azul"}
    ProductVariantInput:
      type: object
      required: [sku, cost, price, axis_values]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Código interno, único en la empresa. Se guarda en mayúsculas.
          minLength: 1
          maxLength: 64
        barcode:
          type: string
          description: Código de barras, único en la empresa. Vacío u omitido si no tiene.
          maxLength: 64
        cost:
          $ref: "#/components/schemas/Money"
        price:
          $ref: "#/components/schemas/Money"
        axis_values:
          $ref: "#/components/schemas/AxisValues"
    ProductWithVariantsInput:
      type: object
      description: |
        Un producto nuevo con todas sus variantes; la primera es la variante por defecto. Los atributos se validan
        contra las definiciones de la empresa (`/product-attributes`).
      required: [name, base_unit_id, tax_rate, attributes, variants]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Camiseta básica cuello redondo
        description:
          type: string
          maxLength: 2000
        category_id:
          type: string
          format: uuid
          nullable: true
        base_unit_id:
          type: string
          format: uuid
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
        attributes:
          $ref: "#/components/schemas/ProductAttributes"
        variants:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProductVariantInput"
    ProductVariantUpdate:
      type: object
      required: [sku, cost, price, axis_values, active]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Código interno, único en la empresa. Se guarda en mayúsculas.
          minLength: 1
          maxLength: 64
        barcode:
          type: string
          description: Código de barras, único en la empresa. Vacío u omitido si no tiene.
          maxLength: 64
        cost:
          $ref: "#/components/schemas/Money"
        price:
          $ref: "#/components/schemas/Money"
        axis_values:
          $ref: "#/components/schemas/AxisValues"
        active:
          type: boolean
          description: Una variante inactiva no se vende.
    UnitFactor:
      type: string
      description: Cuántas unidades base trae una unidad alternativa, como decimal en string (hasta 4 decimales).
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      example: "12"
    VariantUnitInput:
      type: object
      required: [factor, price]
      additionalProperties: false
      properties:
        factor:
          $ref: "#/components/schemas/UnitFactor"
        price:
          $ref: "#/components/schemas/Money"
        barcode:
          type: string
          maxLength: 64
          description: Opcional. No puede repetir el de otra variante ni el de otra unidad de la empresa.
    VariantUnit:
      type: object
      required: [unit, factor, price, price_with_tax]
      description: |
        Otra unidad en la que se vende y se compra la variante: `factor` unidades base por cada una, a `price` sin IVA
        (`price_with_tax` lo incluye con la tasa del producto, redondeado a 2 decimales).
      properties:
        unit:
          $ref: "#/components/schemas/UnitOfMeasure"
        factor:
          $ref: "#/components/schemas/UnitFactor"
        price:
          $ref: "#/components/schemas/Money"
        price_with_tax:
          $ref: "#/components/schemas/Money"
        barcode:
          type: string
          description: Se omite si la unidad no tiene.
    ProductVariant:
      type: object
      required: [id, sku, price, price_with_tax, axis_values, label, units, is_default, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
          description: Se omite si la variante no tiene.
        price:
          $ref: "#/components/schemas/Money"
        price_with_tax:
          $ref: "#/components/schemas/Money"
        cost:
          $ref: "#/components/schemas/Money"
        margin_percent:
          type: string
          description: Margen sobre el precio de venta, en porcentaje. Es negativo si el precio está por debajo del costo.
          example: "16.6667"
        axis_values:
          $ref: "#/components/schemas/AxisValues"
        label:
          type: string
          description: |
            El nombre de la variante: sus valores ordenados por nombre de eje (`Rojo · M`), como lo congela una venta en
            `variant_label`. Vacío si la variante no tiene ejes.
          example: Rojo · M
        units:
          type: array
          description: Las unidades alternativas de la variante, de menor a mayor factor. Vacío si no tiene.
          items:
            $ref: "#/components/schemas/VariantUnit"
        is_default:
          type: boolean
          description: La variante creada con el producto. Un producto simple solo tiene esta.
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
      description: |
        Lo que se vende y se cuenta: el producto en una combinación de sus ejes. El precio no incluye IVA;
        `price_with_tax` lo incluye con la tasa del producto, redondeado a 2 decimales. `cost` y `margin_percent`
        solo se envían a quien puede editar el catálogo (`catalog:write`).
    Product:
      type: object
      required: [id, name, base_unit_id, unit, tax_rate, attributes, active, created_at, variants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          description: Se omite si está vacía.
        category_id:
          type: string
          format: uuid
          description: Se omite si el producto no tiene categoría.
        base_unit_id:
          type: string
          format: uuid
        unit:
          $ref: "#/components/schemas/UnitOfMeasure"
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
        attributes:
          $ref: "#/components/schemas/ProductAttributes"
        active:
          type: boolean
          description: Un producto inactivo no se vende, con ninguna de sus variantes.
        created_at:
          type: string
          format: date-time
        variants:
          type: array
          minItems: 1
          description: Sus variantes, en el orden en que se agregaron; la variante por defecto va primero.
          items:
            $ref: "#/components/schemas/ProductVariant"
      description: |
        Un producto del catálogo: lo que comparten sus variantes (nombre, categoría, unidad base y tasa de IVA).
        Lo que se vende y se cuenta (SKU, código de barras, costo y precio) va en `variants`.
    ProductPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          description: Cantidad total de productos que cumplen el filtro, sin paginar.
    CategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Aseo
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Categoría padre. Omitido o `null`, la categoría queda en la raíz.
    Category:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          description: Se omite si la categoría está en la raíz.
        created_at:
          type: string
          format: date-time
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Quantity:
      type: string
      description: |
        Cantidad como decimal en string (hasta 4 decimales), en la unidad base del producto salvo que el objeto diga
        otra unidad (`unit_id`, `unit_code`).
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      example: "2.5"
    SignedQuantity:
      type: string
      description: Cantidad con signo (negativa si sale), como decimal en string (hasta 4 decimales).
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      example: "-3"
    LocationInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Bodega principal
    Location:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    StockLevel:
      type: object
      required: [variant_id, product_id, location_id, quantity]
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante, para mostrar su nombre.
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        average_cost:
          $ref: "#/components/schemas/Money"
        reorder:
          $ref: "#/components/schemas/StockReorder"
      description: |
        La existencia de una variante en una sede. `quantity` es negativa solo si la empresa permite vender sin
        stock. `average_cost` (costo promedio ponderado, sin IVA) solo se envía a quien tiene `catalog:write`.
        `reorder` solo viene si la variante tiene stock mínimo y máximo en la sede.
    StockReorder:
      type: object
      required: [min_quantity, max_quantity, needs_reorder]
      properties:
        min_quantity:
          $ref: "#/components/schemas/Quantity"
        max_quantity:
          $ref: "#/components/schemas/Quantity"
        needs_reorder:
          type: boolean
          description: La existencia está en el mínimo o por debajo.
      description: El stock mínimo y máximo de la existencia, y si hay que reponerla.
    ReorderRuleInput:
      type: object
      required: [min_quantity, max_quantity]
      additionalProperties: false
      properties:
        min_quantity:
          $ref: "#/components/schemas/Quantity"
        max_quantity:
          $ref: "#/components/schemas/Quantity"
      description: Stock mínimo y máximo en la unidad base del producto, con 0 ≤ mínimo ≤ máximo.
    ReorderRule:
      type: object
      required: [variant_id, location_id, min_quantity, max_quantity]
      properties:
        variant_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        min_quantity:
          $ref: "#/components/schemas/Quantity"
        max_quantity:
          $ref: "#/components/schemas/Quantity"
    ReorderAlert:
      type: object
      required: [variant_id, product_id, location_id, quantity, min_quantity, max_quantity, suggested_quantity]
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante, para mostrar su nombre.
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        min_quantity:
          $ref: "#/components/schemas/Quantity"
        max_quantity:
          $ref: "#/components/schemas/Quantity"
        suggested_quantity:
          $ref: "#/components/schemas/Quantity"
      description: |
        Una variante por reponer en una sede: su existencia (de todos los lotes), su mínimo y máximo y cuánto pedir
        para llegar al máximo. Todo en la unidad base del producto.
    ReorderAlertPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReorderAlert"
        total:
          type: integer
          description: Cantidad total de alertas que cumplen el filtro, sin paginar.
    StockLevelPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockLevel"
        total:
          type: integer
          description: Cantidad total de existencias que cumplen el filtro, sin paginar.
    DocumentRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [purchase, sale, transfer, stock_count]
        id:
          type: string
          format: uuid
    StockMovement:
      type: object
      required: [id, variant_id, product_id, location_id, type, quantity, balance_after, user_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante, para mostrar su nombre.
        location_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [purchase_in, initial_in, sale_out, sale_void, adjustment, transfer_out, transfer_in]
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        unit_cost:
          $ref: "#/components/schemas/Money"
        balance_after:
          $ref: "#/components/schemas/SignedQuantity"
        average_cost_after:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          description: Motivo del ajuste. Se omite en los demás tipos.
        reference:
          $ref: "#/components/schemas/DocumentRef"
        user_id:
          type: string
          format: uuid
          description: Quién registró el movimiento.
        occurred_at:
          type: string
          format: date-time
      description: |
        Un movimiento del kardex. `quantity` es positiva si entra y negativa si sale. `unit_cost` y
        `average_cost_after` solo se envían a quien tiene `catalog:write`. `reference` se omite si no hay documento.
    StockMovementPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockMovement"
        total:
          type: integer
          description: Cantidad total de movimientos que cumplen el filtro, sin paginar.
    StockCountStatus:
      type: string
      enum: [open, approved, canceled]
      description: Abierto mientras se cuenta; luego aprobado (sus ajustes están en el kardex) o cancelado.
    StockCountMode:
      type: string
      enum: [sum, review]
      description: |
        Qué pasa si dos personas cuentan la misma variante: `sum` suma lo de ambas (contaron partes distintas);
        `review` exige que coincidan y, si no, la marca para recontar.
    StockCountInput:
      type: object
      required: [location_id]
      additionalProperties: false
      properties:
        location_id:
          type: string
          format: uuid
        category_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
          description: Las categorías de un conteo parcial (con sus subcategorías). Sin ellas, el conteo es total.
        mode:
          $ref: "#/components/schemas/StockCountMode"
      description: Un conteo nuevo. Sin `mode`, se usa `sum`.
    StockCountSummary:
      type: object
      required: [lines, counted_lines, exact_lines]
      properties:
        lines:
          type: integer
        counted_lines:
          type: integer
        exact_lines:
          type: integer
        accuracy:
          type: string
          pattern: '^(0(\.\d{1,4})?|1(\.0{1,4})?)$'
          description: Fracción de las líneas contadas que coincidieron (de 0 a 1). Se omite si no se contó ninguna.
          example: "0.9500"
        net_difference_value:
          $ref: "#/components/schemas/SignedMoney"
        absolute_difference_value:
          $ref: "#/components/schemas/Money"
      description: |
        La exactitud de un conteo. Los valores (diferencias al costo) solo se envían a quien puede ver costos:
        `net_difference_value` suma las diferencias con su signo y `absolute_difference_value`, sin él.
    StockCount:
      type: object
      required: [id, location_id, category_ids, mode, status, started_by, started_at, lines, counted_lines]
      properties:
        id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        category_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Vacío en un conteo total.
        mode:
          $ref: "#/components/schemas/StockCountMode"
        status:
          $ref: "#/components/schemas/StockCountStatus"
        started_by:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        closed_by:
          type: string
          format: uuid
          description: Quién lo aprobó o canceló.
        closed_at:
          type: string
          format: date-time
        lines:
          type: integer
          description: Variantes en el conteo.
        counted_lines:
          type: integer
          description: Variantes que ya se contaron en su ronda vigente.
        summary:
          $ref: "#/components/schemas/StockCountSummary"
      description: Un conteo físico. Solo los aprobados traen `summary`.
    StockCountPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockCount"
        total:
          type: integer
          description: Cantidad total de conteos que cumplen el filtro, sin paginar.
    CountEntryInput:
      type: object
      required: [variant_id, quantity]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
        unit_id:
          type: string
          format: uuid
          description: Una unidad alternativa de la variante en la que va `quantity`. Sin ella, la unidad base.
    CountEntry:
      type: object
      required: [id, variant_id, product_id, quantity, counted_by, counted_at]
      properties:
        id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante, para mostrar su nombre.
        quantity:
          $ref: "#/components/schemas/Quantity"
        counted_by:
          type: string
          format: uuid
        counted_at:
          type: string
          format: date-time
      description: Lo que una persona contó de una variante, en la unidad base del producto.
    CountEntryPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CountEntry"
        total:
          type: integer
          description: Cantidad total de conteos que cumplen el filtro, sin paginar.
    StockCountLineStatus:
      type: string
      enum: [uncounted, exact, difference, review]
      description: Sin contar, coincide, con diferencia o en revisión (los contadores no coinciden).
    StockCountLine:
      type: object
      required: [variant_id, product_id, status, expected_quantity]
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante, para mostrar su nombre.
        status:
          $ref: "#/components/schemas/StockCountLineStatus"
        expected_quantity:
          $ref: "#/components/schemas/SignedQuantity"
        counted_quantity:
          $ref: "#/components/schemas/Quantity"
        difference:
          $ref: "#/components/schemas/SignedQuantity"
        difference_value:
          $ref: "#/components/schemas/SignedMoney"
      description: |
        Una variante del conteo. `expected_quantity` es el stock al inicio más las entradas menos las salidas hasta
        que se contó. `counted_quantity` y `difference` (contado − esperado) se omiten si está sin contar o en revisión,
        y `difference_value` (la diferencia al costo del inicio) además si no se pueden ver costos.
    StockCountLinePage:
      type: object
      required: [items, total, summary]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockCountLine"
        total:
          type: integer
          description: Cantidad total de líneas que cumplen el filtro, sin paginar.
        summary:
          $ref: "#/components/schemas/StockCountSummary"
    RecountInput:
      type: object
      required: [variant_ids]
      additionalProperties: false
      properties:
        variant_ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
    ReceiptInput:
      type: object
      required: [variant_id, location_id, quantity, unit_cost]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
        unit_cost:
          $ref: "#/components/schemas/Money"
        unit_id:
          type: string
          format: uuid
          description: |
            Una unidad alternativa de la variante en la que vienen `quantity` y `unit_cost` (por ejemplo, cajas). Sin
            ella, vienen en la unidad base. La entrada se guarda convertida a la unidad base: cantidad × factor, a un
            costo de costo ÷ factor redondeado a 4 decimales.
    AdjustmentInput:
      type: object
      required: [variant_id, location_id, quantity, reason]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Unidad dañada en la bodega
    TransferInput:
      type: object
      required: [variant_id, from_location_id, to_location_id, quantity]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
    TransferResult:
      type: object
      required: [out, in]
      properties:
        out:
          $ref: "#/components/schemas/StockMovement"
        in:
          $ref: "#/components/schemas/StockMovement"
    PersonType:
      type: string
      description: Persona natural (`natural`) o jurídica (`legal`). Una persona jurídica se identifica con NIT.
      enum: [natural, legal]
    DocumentType:
      type: string
      description: |
        Cédula de ciudadanía (`cc`), NIT (`nit`), cédula de extranjería (`ce`) o pasaporte (`passport`).
      enum: [cc, nit, ce, passport]
    TaxResponsibility:
      type: string
      description: |
        Responsabilidad fiscal del RUT que pide la factura electrónica: gran contribuyente (`O-13`), autorretenedor
        (`O-15`), agente de retención de IVA (`O-23`), régimen simple (`O-47`) o ninguna de ellas (`R-99-PN`).
      enum: [O-13, O-15, O-23, O-47, R-99-PN]
    TaxResponsibilities:
      type: array
      description: |
        Sin repetir. `R-99-PN` no se combina con las demás. Sin ninguna, el cliente queda con `R-99-PN`.
      maxItems: 5
      items:
        $ref: "#/components/schemas/TaxResponsibility"
    Customer:
      type: object
      description: |
        Un cliente de la empresa. `document_number` está en su forma canónica: el NIT con su dígito de verificación
        (`900123456-8`), la cédula solo con dígitos y el pasaporte en mayúsculas.
      required: [id, person_type, document_type, document_number, name, tax_responsibilities, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        person_type:
          $ref: "#/components/schemas/PersonType"
        document_type:
          $ref: "#/components/schemas/DocumentType"
        document_number:
          type: string
          example: 900123456-8
        name:
          type: string
          description: Nombre completo o razón social.
        trade_name:
          type: string
          description: Nombre comercial, si es distinto de la razón social.
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        segment_id:
          type: string
          format: uuid
        tax_responsibilities:
          type: array
          items:
            $ref: "#/components/schemas/TaxResponsibility"
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    CustomerInput:
      type: object
      description: |
        Los datos de un cliente. El NIT se escribe con su dígito de verificación (con o sin guion y puntos). Los
        campos de contacto vacíos se guardan como ausentes.
      required: [person_type, document_type, document_number, name]
      additionalProperties: false
      properties:
        person_type:
          $ref: "#/components/schemas/PersonType"
        document_type:
          $ref: "#/components/schemas/DocumentType"
        document_number:
          type: string
          minLength: 1
          maxLength: 30
          example: 900.123.456-8
        name:
          type: string
          minLength: 1
          maxLength: 200
        trade_name:
          type: string
          maxLength: 200
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        segment_id:
          type: string
          format: uuid
          description: Un segmento de la empresa (`/customer-segments`). Sin él, el cliente no tiene segmento.
        tax_responsibilities:
          $ref: "#/components/schemas/TaxResponsibilities"
        active:
          type: boolean
          default: true
          description: Un cliente inactivo no aparece en la búsqueda del POS ni se le puede vender.
    CustomerPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
          description: Cantidad total de clientes que cumplen el filtro, sin paginar.
    CustomerSegment:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Mayorista
    CustomerSegmentInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Único en la empresa, sin importar las mayúsculas.
          minLength: 1
          maxLength: 60
          example: Mayorista
    CustomerSegmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSegment"
    ConfirmSaleInput:
      type: object
      required: [location_id, lines, payments]
      additionalProperties: false
      properties:
        location_id:
          type: string
          format: uuid
          description: Sede donde se vende y de donde sale el stock.
        customer_id:
          type: string
          format: uuid
          description: El cliente activo a quien se vende (`/customers`). Sin él, la venta es a consumidor final.
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SaleLineInput"
        payments:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PaymentInput"
    SaleLineInput:
      type: object
      description: |
        Una línea del carrito: una variante y la cantidad. `discount` es un monto en pesos sobre la línea, antes de
        IVA (por defecto, 0). El precio lo pone el servidor.
      required: [variant_id, quantity]
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
        unit_id:
          type: string
          format: uuid
          description: |
            Una unidad alternativa de la variante en la que se vende la línea (por ejemplo, una caja); `quantity` y el
            precio son en esa unidad. Sin ella, la línea es en la unidad base. Si la variante no tiene esa unidad, la
            venta se rechaza (`unit_not_available`).
        discount:
          $ref: "#/components/schemas/Money"
    PaymentMethod:
      type: string
      enum: [cash, card, nequi, daviplata, transfer]
      description: Medio de pago. Solo el efectivo (`cash`) da cambio.
    PaymentInput:
      type: object
      description: Un pago. En efectivo, `amount` es lo entregado e incluye el cambio.
      required: [method, amount]
      additionalProperties: false
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          $ref: "#/components/schemas/Money"
    VoidSaleInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: El cliente desistió de la compra
    DiscountLimit:
      type: object
      description: |
        Tope de descuento de una línea como fracción de su bruto (`0.10` permite descontar el 10 %). Con
        `unlimited`, `max` es `1`.
      required: [unlimited, max]
      properties:
        unlimited:
          type: boolean
        max:
          type: string
          pattern: '^(0(\.\d{1,4})?|1(\.0{1,4})?)$'
          example: "0.10"
    SaleStatus:
      type: string
      enum: [confirmed, voided]
    SaleLine:
      type: object
      description: |
        Una línea vendida: una variante de un producto. `unit_price` es sin IVA, en el momento de la venta, y
        `price_rule` dice qué regla lo dio. `gross` = cantidad × precio redondeado a 2 decimales; `base` = `gross` −
        `discount`; `tax` = `base` × `tax_rate` redondeado a 2 decimales; `total` = `base` + `tax`. La cantidad y el
        precio son en la unidad vendida: `unit_code` si fue una unidad alternativa, o la unidad base del producto.
      required: [variant_id, product_id, product_name, quantity, unit_factor, base_quantity, unit_price, price_rule, tax_rate, discount, gross, base, tax, total]
      properties:
        variant_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: El producto de la variante.
        product_name:
          type: string
          description: Nombre del producto en el momento de la venta.
        variant_label:
          type: string
          description: |
            La variante en el momento de la venta: sus valores ordenados por nombre de eje (`Rojo · M`). No viene si
            la variante no tiene ejes, como la de un producto simple.
          example: Rojo · M
        quantity:
          $ref: "#/components/schemas/Quantity"
        unit_code:
          type: string
          description: |
            El código de la unidad alternativa en que se vendió la línea, congelado en la venta. No viene si se vendió
            en la unidad base del producto.
          example: caja
        unit_factor:
          $ref: "#/components/schemas/UnitFactor"
        base_quantity:
          $ref: "#/components/schemas/Quantity"
        unit_price:
          $ref: "#/components/schemas/Money"
        price_rule:
          type: string
          description: |
            ID estable de la regla de precio que dio `unit_price`: `variant_price` (el precio de la variante) o el de
            una regla de un módulo (por ejemplo, `price_lists`).
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          example: variant_price
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
        discount:
          $ref: "#/components/schemas/Money"
        gross:
          $ref: "#/components/schemas/Money"
        base:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
    SalePayment:
      type: object
      required: [method, amount]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          $ref: "#/components/schemas/Money"
    TaxBreakdown:
      type: object
      required: [rate, base, tax]
      properties:
        rate:
          $ref: "#/components/schemas/TaxRate"
        base:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
    SaleTotals:
      type: object
      description: |
        `subtotal` es la suma de los brutos de las líneas y `total` = `subtotal` − `discounts` + `tax`. `taxes`
        suma las bases y el IVA de las líneas por tasa, sin volver a redondear.
      required: [subtotal, discounts, tax, total, taxes]
      properties:
        subtotal:
          $ref: "#/components/schemas/Money"
        discounts:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        taxes:
          type: array
          description: IVA agrupado por tasa, de menor a mayor.
          items:
            $ref: "#/components/schemas/TaxBreakdown"
    SaleVoid:
      type: object
      required: [user_id, reason, voided_at]
      properties:
        user_id:
          type: string
          format: uuid
          description: Quién anuló.
        reason:
          type: string
        voided_at:
          type: string
          format: date-time
    Sale:
      type: object
      description: |
        Una venta confirmada o anulada. `change` es el cambio entregado en efectivo. `void` solo aparece en una
        venta anulada.
      required: [id, number, location_id, user_id, status, lines, payments, totals, paid, change, confirmed_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: Consecutivo de la venta en su sede.
        location_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Quién vendió.
        customer_id:
          type: string
          format: uuid
          description: El cliente; no viene si la venta fue a consumidor final.
        cash_session_id:
          type: string
          format: uuid
          description: La caja donde se cobró; no viene si se vendió sin caja.
        status:
          $ref: "#/components/schemas/SaleStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SaleLine"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/SalePayment"
        totals:
          $ref: "#/components/schemas/SaleTotals"
        paid:
          $ref: "#/components/schemas/Money"
        change:
          $ref: "#/components/schemas/Money"
        confirmed_at:
          type: string
          format: date-time
        void:
          $ref: "#/components/schemas/SaleVoid"
    SaleSummary:
      type: object
      required: [id, number, location_id, user_id, status, total, confirmed_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
        location_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SaleStatus"
        total:
          $ref: "#/components/schemas/Money"
        confirmed_at:
          type: string
          format: date-time
        voided_at:
          type: string
          format: date-time
    SalePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleSummary"
        total:
          type: integer
          description: Cantidad total de ventas que cumplen el filtro, sin paginar.
    SignedMoney:
      type: string
      description: Monto en pesos colombianos con signo, como decimal en string (hasta 4 decimales).
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      example: "-4800.00"
    OpenCashSessionInput:
      type: object
      required: [location_id, opening_float]
      additionalProperties: false
      properties:
        location_id:
          type: string
          format: uuid
          description: Sede de la caja; las ventas de la caja son de esta sede.
        opening_float:
          $ref: "#/components/schemas/Money"
    CashMovementKind:
      type: string
      enum: [in, out]
      description: "`in` es un ingreso de efectivo a la caja y `out` un egreso."
    CashMovementInput:
      type: object
      required: [kind, amount, reason]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/CashMovementKind"
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          minLength: 1
          maxLength: 200
          example: Pago del domicilio
    CashMovement:
      type: object
      required: [id, kind, amount, reason, user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CashMovementKind"
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    DenominationCount:
      type: object
      description: |
        Billetes o monedas contados de una denominación del peso colombiano: 100000, 50000, 20000, 10000, 5000, 2000,
        1000 (billete y moneda juntos), 500, 200, 100 o 50.
      required: [denomination, quantity]
      additionalProperties: false
      properties:
        denomination:
          $ref: "#/components/schemas/Money"
        quantity:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
    CloseCashSessionInput:
      type: object
      required: [counts]
      additionalProperties: false
      properties:
        counts:
          type: array
          description: Una entrada por denominación, sin repetir. Un conteo vacío es una caja sin efectivo.
          maxItems: 11
          items:
            $ref: "#/components/schemas/DenominationCount"
        notes:
          type: string
          maxLength: 500
    CashMethodTotal:
      type: object
      description: Lo que cobraron las ventas de la caja con un medio de pago; el efectivo es neto del cambio.
      required: [method, amount]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          $ref: "#/components/schemas/Money"
    CashClosing:
      type: object
      description: |
        El reporte de cierre. `expected` = base + `cash_received` + `cash_in` − `cash_out` − `change_given`, de las
        ventas confirmadas de la caja (las anuladas antes del cierre no cuentan); `difference` = `counted` −
        `expected`: negativa es faltante (`shortage`) y positiva, sobrante (`overage`).
      required: [closed_at, closed_by, sales_count, cash_received, change_given, cash_in, cash_out, expected, counted,
        difference, result, counts, payments]
      properties:
        closed_at:
          type: string
          format: date-time
        closed_by:
          type: string
          format: uuid
        notes:
          type: string
        sales_count:
          type: integer
          description: Ventas confirmadas de la caja.
        cash_received:
          $ref: "#/components/schemas/Money"
        change_given:
          $ref: "#/components/schemas/Money"
        cash_in:
          $ref: "#/components/schemas/Money"
        cash_out:
          $ref: "#/components/schemas/Money"
        expected:
          $ref: "#/components/schemas/SignedMoney"
        counted:
          $ref: "#/components/schemas/Money"
        difference:
          $ref: "#/components/schemas/SignedMoney"
        result:
          type: string
          enum: [exact, shortage, overage]
        counts:
          type: array
          description: El conteo, de la denominación más alta a la más baja.
          items:
            $ref: "#/components/schemas/DenominationCount"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/CashMethodTotal"
    CashSession:
      type: object
      description: Una caja. `closing` solo viene cuando está cerrada.
      required: [id, location_id, user_id, status, opening_float, opened_at, movements]
      properties:
        id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: El cajero.
        status:
          type: string
          enum: [open, closed]
        opening_float:
          $ref: "#/components/schemas/Money"
        opened_at:
          type: string
          format: date-time
        movements:
          type: array
          description: Ingresos y egresos, del más antiguo al más reciente.
          items:
            $ref: "#/components/schemas/CashMovement"
        closing:
          $ref: "#/components/schemas/CashClosing"
    CurrentCashSession:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: Si la empresa exige caja abierta para vender.
        session:
          $ref: "#/components/schemas/CashSession"
    ImportFormat:
      type: string
      enum: [xlsx, csv]
      default: xlsx
    ImportStatus:
      type: string
      description: |
        `rejected` (el archivo tiene errores), `validated` (se puede confirmar), `queued` (confirmada, esperando el
        trabajo), `running`, `completed` o `failed` (un lote no se pudo escribir; ver sus errores).
      enum: [rejected, validated, queued, running, completed, failed]
    ExistingSkuPolicy:
      type: string
      description: |
        Qué hacer con un producto cuyo SKU ya está en el catálogo: `update` reemplaza sus datos y agrega las variantes
        nuevas; `skip` lo deja como está.
      enum: [update, skip]
    ImportUpload:
      type: object
      required: [file, location_id]
      properties:
        file:
          type: string
          format: binary
          description: La hoja de cálculo (`.xlsx` o `.csv`), hasta 10 MB.
        location_id:
          type: string
          format: uuid
          description: La sede que recibe el stock inicial.
        on_existing_sku:
          # The values of ExistingSkuPolicy, inline: the validator cannot decode a multipart
          # field declared with allOf or $ref, and rejects the whole form. No default: it
          # cannot rewrite a multipart body with it.
          type: string
          enum: [update, skip]
          description: Qué hacer con un SKU que ya está en el catálogo (`ExistingSkuPolicy`); si no se envía, `update`.
    ImportCounts:
      type: object
      required: [rows, products, created, updated, skipped, errors]
      description: Filas y productos del archivo; productos creados, actualizados y omitidos hasta ahora; errores.
      properties:
        rows:
          type: integer
        products:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
    Import:
      type: object
      required: [id, file_name, format, status, on_existing_sku, location_id, counts, created_at]
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        format:
          $ref: "#/components/schemas/ImportFormat"
        status:
          $ref: "#/components/schemas/ImportStatus"
        on_existing_sku:
          $ref: "#/components/schemas/ExistingSkuPolicy"
        location_id:
          type: string
          format: uuid
        counts:
          $ref: "#/components/schemas/ImportCounts"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    ImportRowError:
      type: object
      required: [row, column, code, message]
      description: Un problema de una fila del archivo (la fila 1 es el encabezado).
      properties:
        row:
          type: integer
          example: 154
        column:
          type: string
          description: La columna del problema, o vacío si es del producto entero.
          example: precio
        code:
          type: string
          example: not_a_number
        message:
          type: string
          example: "Fila 154, columna «precio»: no es un número."
    ImportVariantPreview:
      type: object
      required: [row, sku, price, axis_values]
      properties:
        row:
          type: integer
        sku:
          type: string
        price:
          type: string
          description: |
            El precio como lo leyó la importación: el monto o, si la celda no es un número válido, su texto tal cual
            (vacío si la celda está vacía), para mostrar lo que dice el archivo.
        axis_values:
          type: object
          additionalProperties:
            type: string
        initial_stock:
          type: string
          nullable: true
    ImportProductPreview:
      type: object
      required: [row, name, category, unit, variants]
      properties:
        row:
          type: integer
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ImportVariantPreview"
    ImportPreview:
      type: object
      required: [import, errors, sample]
      properties:
        import:
          $ref: "#/components/schemas/Import"
        errors:
          type: array
          description: Los primeros 50 errores; el resto en `/imports/{importId}/errors`.
          items:
            $ref: "#/components/schemas/ImportRowError"
        sample:
          type: array
          description: Los primeros 10 productos del archivo.
          items:
            $ref: "#/components/schemas/ImportProductPreview"
    ImportErrorPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
        total:
          type: integer
