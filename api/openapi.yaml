openapi: 3.0.3
info:
  title: Cuadra API
  version: 0.1.0
  description: |
    API de Cuadra, el SaaS de gestión para pymes.

    Convenciones:
    - Los endpoints de negocio viven bajo `/api/v1` y requieren un token Bearer (JWT).
    - Los errores siempre usan el esquema `Error`: `{"error": {"code": "...", "message": "..."}}`.
      `code` es estable y legible por máquina; `message` está en español y se puede mostrar al usuario.
    - El dinero y las cantidades viajan como strings decimales (`"12500.00"`), nunca como números.
    - La paginación usa `limit` (máximo 100) y `offset`.
    - Las fechas van en RFC 3339, en UTC.
servers:
  - url: http://localhost:8080
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: health
    description: Probes de liveness y readiness. No requieren autenticación.
  - name: auth
    description: |
      Registro, inicio de sesión y sesión del usuario.

      El access token (JWT) dura 15 minutos y se envía en `Authorization: Bearer`. El refresh token
      viaja solo en la cookie `cuadra_refresh` (HttpOnly, Secure, SameSite=Strict, ruta `/api/v1/auth`),
      rota en cada uso y su reutilización cierra todas las sesiones de esa familia.
  - name: catalog
    description: |
      Productos y categorías de la empresa. El dinero viaja como string decimal y el precio no incluye IVA.
  - name: inventory
    description: |
      Sedes, existencias y kardex. Las cantidades están en la unidad base del producto y viajan como string decimal.
      Cada cambio de stock queda como un movimiento inmutable del kardex. Los costos (`average_cost`, `unit_cost`,
      `average_cost_after`) solo se envían a quien puede editar el catálogo (`catalog:write`).

# Authorization is declared here and enforced by the API before the request
# is validated: every operation requires a bearer token unless it says
# `security: []`, and `x-permission` names the permission the user's role
# must grant (see the permission matrix of the identity module).

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness
      description: El proceso está vivo. No revisa dependencias.
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness
      description: Las dependencias (base de datos) responden y la instancia puede recibir tráfico.
      security: []
      responses:
        "200":
          description: La instancia está lista.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Alguna dependencia no responde (`code` = `not_ready`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Registrar una empresa
      description: Crea la empresa (tenant) y su usuario dueño, e inicia la sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Empresa creada; la sesión queda iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_email`, `invalid_nit`, `invalid_nit_check_digit`,
            `password_too_short`, `password_too_long`, `invalid_tenant_name`, `invalid_user_name`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión
      description: |
        Si el correo y la contraseña coinciden en varias empresas, responde 409 con la lista de
        empresas; el cliente repite la request con el `tenant_id` elegido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Correo o contraseña incorrectos (`code` = `invalid_credentials`). No revela si el correo existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La empresa está suspendida (`code` = `tenant_suspended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Las credenciales son válidas en varias empresas (`code` = `tenant_selection_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSelectionRequired"
        "429":
          description: Demasiados intentos (`code` = `too_many_requests`).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de intentar de nuevo.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renovar la sesión
      description: Cambia el refresh token de la cookie por uno nuevo y emite un access token nuevo.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          description: Sesión renovada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Falta la cookie, o el refresh token no es válido, venció o fue reutilizado (`code` = `invalid_session`).
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión
      description: Revoca el refresh token de la cookie (y su familia) y borra la cookie. Es idempotente.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuario actual
      description: El usuario autenticado, su empresa y sus permisos.
      responses:
        "200":
          description: El usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Buscar productos
      description: |
        Lista los productos de la empresa. Con `q` busca por nombre (cada palabra debe aparecer, sin
        importar tildes ni mayúsculas) o por SKU o código de barras exactos, que salen primero.
        Sin `q`, ordena por nombre.
      x-permission: catalog:read
      parameters:
        - name: q
          in: query
          description: Texto a buscar.
          required: false
          schema:
            type: string
            maxLength: 100
          example: tubo pvc
        - name: category_id
          in: query
          description: Solo los productos de esta categoría.
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Productos activos (por defecto), inactivos o todos.
          required: false
          schema:
            type: string
            enum: [active, inactive, all]
            default: active
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de productos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Crear un producto
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Producto creado (activo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: El SKU o el código de barras ya existen en la empresa (`sku_taken`, `barcode_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_sku`, `invalid_barcode`, `invalid_product_name`,
            `invalid_description`, `invalid_price`, `invalid_cost`, `invalid_tax_rate`, `category_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Ver un producto
      description: Devuelve el producto aunque esté inactivo.
      x-permission: catalog:read
      responses:
        "200":
          description: El producto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [catalog]
      operationId: updateProduct
      summary: Editar un producto
      description: Reemplaza todos los datos editables. El precio de un producto inactivo no se puede cambiar.
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: El producto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El SKU o el código de barras ya existen en la empresa (`sku_taken`, `barcode_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Algún dato no cumple las reglas (los mismos códigos de crear un producto) o se cambió el precio
            de un producto inactivo (`product_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [catalog]
      operationId: deactivateProduct
      summary: Desactivar un producto
      description: El producto deja de venderse, pero se conserva para el historial. Es idempotente.
      x-permission: catalog:write
      responses:
        "200":
          description: El producto, inactivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}/activate:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [catalog]
      operationId: activateProduct
      summary: Activar un producto
      description: El producto se puede vender de nuevo. Es idempotente.
      x-permission: catalog:write
      responses:
        "200":
          description: El producto, activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Listar categorías
      description: Todas las categorías de la empresa, ordenadas por nombre. El árbol se arma con `parent_id`.
      x-permission: catalog:read
      responses:
        "200":
          description: Las categorías.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [catalog]
      operationId: createCategory
      summary: Crear una categoría
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoría creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: El nombre no es válido (`invalid_category_name`) o el padre no existe (`category_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    put:
      tags: [catalog]
      operationId: updateCategory
      summary: Editar una categoría
      description: Cambia el nombre y el padre. Sin `parent_id`, la categoría queda en la raíz.
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: La categoría actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            El nombre no es válido (`invalid_category_name`), el padre no existe (`category_not_found`), el padre
            es la misma categoría (`invalid_category_parent`) o el movimiento formaría un ciclo (`category_cycle`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [catalog]
      operationId: deleteCategory
      summary: Borrar una categoría
      description: Solo se puede borrar una categoría sin productos ni subcategorías.
      x-permission: catalog:write
      responses:
        "204":
          description: Categoría borrada.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La categoría tiene productos o subcategorías (`category_in_use`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/locations:
    get:
      tags: [inventory]
      operationId: listLocations
      summary: Listar sedes
      description: Todas las sedes y bodegas de la empresa, activas o no, ordenadas por nombre.
      x-permission: inventory:read
      responses:
        "200":
          description: Las sedes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [inventory]
      operationId: createLocation
      summary: Crear una sede
      x-permission: tenant:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Sede creada (activa).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe una sede con ese nombre (`location_name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: El nombre no es válido (`invalid_location_name`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/locations/{locationId}/stock:
    parameters:
      - $ref: "#/components/parameters/LocationId"
    get:
      tags: [inventory]
      operationId: listStock
      summary: Existencias de una sede
      description: |
        Los productos que han tenido movimientos en la sede, con su cantidad y costo promedio. Un producto sin
        movimientos no aparece (su existencia es cero).
      x-permission: inventory:read
      parameters:
        - name: product_id
          in: query
          description: Solo la existencia de este producto.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página de existencias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLevelPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}/kardex:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [inventory]
      operationId: getKardex
      summary: Kardex de un producto
      description: |
        Los movimientos del producto, del más reciente al más antiguo. `balance_after` es el saldo en la sede
        del movimiento justo después de él.
      x-permission: inventory:read
      parameters:
        - name: location_id
          in: query
          description: Solo los movimientos de esta sede.
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Una página del kardex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/receipts:
    post:
      tags: [inventory]
      operationId: receiveStock
      summary: Registrar una entrada de mercancía
      description: |
        Suma la cantidad a la existencia de la sede y recalcula el costo promedio ponderado. Sirve también para el
        inventario inicial.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: El movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `invalid_unit_cost`, `product_not_found`,
            `location_not_found`, `location_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/adjustments:
    post:
      tags: [inventory]
      operationId: adjustStock
      summary: Registrar un ajuste de inventario
      description: |
        Corrige la existencia en la cantidad indicada (positiva suma, negativa resta) por un motivo obligatorio. Se
        valora al costo promedio y no lo cambia.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentInput"
      responses:
        "201":
          description: El movimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `adjustment_reason_required`,
            `adjustment_reason_too_long`, `insufficient_stock`, `product_not_found`, `location_not_found`,
            `location_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/transfers:
    post:
      tags: [inventory]
      operationId: transferStock
      summary: Trasladar mercancía entre sedes
      description: |
        Saca la cantidad de la sede de origen y la entra en la de destino, valorada al costo promedio del origen.
        Los dos movimientos comparten la misma referencia de traslado.
      x-permission: inventory:adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Los dos movimientos del traslado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Algún dato no cumple las reglas (`invalid_quantity`, `same_location_transfer`, `insufficient_stock`,
            `product_not_found`, `location_not_found`, `location_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  headers:
    SetRefreshCookie:
      description: |
        Cookie `cuadra_refresh` con el refresh token (HttpOnly, Secure, SameSite=Strict, ruta `/api/v1/auth`).
        Al cerrar sesión o si la sesión no es válida, la cookie se borra.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: Cantidad máxima de resultados.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Cantidad de resultados a saltar.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefreshCookie:
      name: cuadra_refresh
      in: cookie
      description: Refresh token. Lo pone la API; el navegador lo envía solo a `/api/v1/auth`.
      required: false
      schema:
        type: string
        maxLength: 200

  responses:
    BadRequest:
      description: La request no cumple el contrato (`code` = `invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Falta el token o no es válido (`code` = `unauthorized`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: El usuario no tiene permiso para esta acción (`code` = `forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: El recurso no existe (`code` = `not_found` u otro más específico).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: La operación choca con el estado actual (por ejemplo, un SKU duplicado).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: La request es válida, pero viola una regla de negocio (por ejemplo, `insufficient_stock`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Error inesperado del servidor (`code` = `internal_error`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      example:
        error:
          code: insufficient_stock
          message: No hay stock suficiente de Cemento gris 50kg
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable, en snake_case, para que el cliente decida qué hacer.
        message:
          type: string
          description: Mensaje en español que se puede mostrar al usuario.
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    SignUpRequest:
      type: object
      required: [tenant_name, nit, name, email, password]
      additionalProperties: false
      properties:
        tenant_name:
          type: string
          description: Nombre de la empresa.
          minLength: 1
          maxLength: 200
          example: Ferretería El Tornillo
        nit:
          type: string
          description: NIT con dígito de verificación (`890903938-8`).
          minLength: 2
          maxLength: 20
          example: 890903938-8
        name:
          type: string
          description: Nombre del dueño.
          minLength: 1
          maxLength: 200
          example: Ana Gómez
        email:
          type: string
          minLength: 3
          maxLength: 254
          example: ana@eltornillo.co
        password:
          type: string
          description: Entre 8 y 72 caracteres.
          format: password
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
        tenant_id:
          type: string
          format: uuid
          description: Empresa elegida tras una respuesta 409 `tenant_selection_required`.
    AuthSession:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: "JWT para el header `Authorization: Bearer`."
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Segundos de vida del access token.
          example: 900
        user:
          $ref: "#/components/schemas/Me"
    Me:
      type: object
      required: [id, tenant_id, tenant_name, name, email, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, cashier, warehouse]
        permissions:
          type: array
          description: Permisos del rol, para mostrar u ocultar acciones en la UI.
          items:
            type: string
          example: [catalog:read, sales:create]
    TenantSelectionRequired:
      type: object
      required: [error, tenants]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantOption"
    TenantOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Money:
      type: string
      description: Monto en pesos colombianos, como decimal en string (hasta 4 decimales).
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      example: "12500.00"
    TaxRate:
      type: string
      description: Tasa de IVA como fracción decimal (`0.19` es 19 %), menor que 1 y con hasta 4 decimales.
      pattern: '^0(\.\d{1,4})?$'
      example: "0.19"
    UnitOfMeasure:
      type: string
      description: Unidad base en la que se cuenta y se vende el producto.
      enum: [und, m, kg, l, caja, rollo, bulto, galon]
    ProductInput:
      type: object
      required: [sku, name, base_unit, cost, price, tax_rate]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: Código interno, único en la empresa. Se guarda en mayúsculas.
          minLength: 1
          maxLength: 64
          example: TUB-PVC-12
        barcode:
          type: string
          description: Código de barras, único en la empresa. Vacío u omitido si no tiene.
          maxLength: 64
          example: "7701234567890"
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Tubo PVC presión 1/2 pulgada
        description:
          type: string
          maxLength: 2000
        category_id:
          type: string
          format: uuid
          nullable: true
        base_unit:
          $ref: "#/components/schemas/UnitOfMeasure"
        cost:
          $ref: "#/components/schemas/Money"
        price:
          $ref: "#/components/schemas/Money"
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
    Product:
      type: object
      required: [id, sku, name, base_unit, price, price_with_tax, tax_rate, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          example: TUB-PVC-12
        barcode:
          type: string
          description: Se omite si el producto no tiene.
        name:
          type: string
        description:
          type: string
          description: Se omite si está vacía.
        category_id:
          type: string
          format: uuid
          description: Se omite si el producto no tiene categoría.
        base_unit:
          $ref: "#/components/schemas/UnitOfMeasure"
        cost:
          $ref: "#/components/schemas/Money"
        price:
          $ref: "#/components/schemas/Money"
        price_with_tax:
          $ref: "#/components/schemas/Money"
        tax_rate:
          $ref: "#/components/schemas/TaxRate"
        margin_percent:
          type: string
          description: Margen sobre el precio de venta, en porcentaje. Es negativo si el precio está por debajo del costo.
          example: "16.6667"
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
      description: |
        Un producto del catálogo. El precio no incluye IVA; `price_with_tax` lo incluye, redondeado a 2 decimales.
        `cost` y `margin_percent` solo se envían a quien puede editar el catálogo (`catalog:write`).
    ProductPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          description: Cantidad total de productos que cumplen el filtro, sin paginar.
    CategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Plomería
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Categoría padre. Omitido o `null`, la categoría queda en la raíz.
    Category:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          description: Se omite si la categoría está en la raíz.
        created_at:
          type: string
          format: date-time
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Quantity:
      type: string
      description: Cantidad en la unidad base del producto, como decimal en string (hasta 4 decimales).
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      example: "2.5"
    SignedQuantity:
      type: string
      description: Cantidad con signo (negativa si sale), como decimal en string (hasta 4 decimales).
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      example: "-3"
    LocationInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Bodega principal
    Location:
      type: object
      required: [id, name, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    StockLevel:
      type: object
      required: [product_id, location_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        average_cost:
          $ref: "#/components/schemas/Money"
      description: |
        La existencia de un producto en una sede. `quantity` es negativa solo si la empresa permite vender sin
        stock. `average_cost` (costo promedio ponderado, sin IVA) solo se envía a quien tiene `catalog:write`.
    StockLevelPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockLevel"
        total:
          type: integer
          description: Cantidad total de existencias que cumplen el filtro, sin paginar.
    DocumentRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [purchase, sale, transfer]
        id:
          type: string
          format: uuid
    StockMovement:
      type: object
      required: [id, product_id, location_id, type, quantity, balance_after, user_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [purchase_in, sale_out, adjustment, transfer_out, transfer_in]
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        unit_cost:
          $ref: "#/components/schemas/Money"
        balance_after:
          $ref: "#/components/schemas/SignedQuantity"
        average_cost_after:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          description: Motivo del ajuste. Se omite en los demás tipos.
        reference:
          $ref: "#/components/schemas/DocumentRef"
        user_id:
          type: string
          format: uuid
          description: Quién registró el movimiento.
        occurred_at:
          type: string
          format: date-time
      description: |
        Un movimiento del kardex. `quantity` es positiva si entra y negativa si sale. `unit_cost` y
        `average_cost_after` solo se envían a quien tiene `catalog:write`. `reference` se omite si no hay documento.
    StockMovementPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockMovement"
        total:
          type: integer
          description: Cantidad total de movimientos que cumplen el filtro, sin paginar.
    ReceiptInput:
      type: object
      required: [product_id, location_id, quantity, unit_cost]
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
        unit_cost:
          $ref: "#/components/schemas/Money"
    AdjustmentInput:
      type: object
      required: [product_id, location_id, quantity, reason]
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/SignedQuantity"
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Bulto roto en la bodega
    TransferInput:
      type: object
      required: [product_id, from_location_id, to_location_id, quantity]
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Quantity"
    TransferResult:
      type: object
      required: [out, in]
      properties:
        out:
          $ref: "#/components/schemas/StockMovement"
        in:
          $ref: "#/components/schemas/StockMovement"
