# Local development only. Credentials here are throwaway defaults.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuadra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuadra}
      POSTGRES_DB: ${POSTGRES_DB:-cuadra}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Observability stack (`make obs-up`). Local only: Grafana has no login.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    depends_on: [tempo, loki, prometheus]

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:3.0.3
    profiles: [observability]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [tempo, loki, prometheus]

  # River UI (`make jobs-ui`): browse and retry background jobs. Development
  # only; it connects as the schema owner and has no login.
  riverui:
    image: ghcr.io/riverqueue/riverui:0.20.0
    profiles: [jobs]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cuadra}:${POSTGRES_PASSWORD:-cuadra}@postgres:5432/${POSTGRES_DB:-cuadra}?sslmode=disable
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # End-to-end stack (`make e2e-up`, e2e/README.md): its own Postgres in memory,
  # the migrations and the API on :18080, apart from the development database
  # and from `make run`. Every run starts from an empty database.
  postgres-e2e:
    image: postgres:16-alpine
    profiles: [e2e]
    environment:
      POSTGRES_USER: cuadra
      POSTGRES_PASSWORD: cuadra
      POSTGRES_DB: cuadra
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuadra -d cuadra"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate-e2e:
    build:
      context: backend
      target: migrate
    profiles: [e2e]
    environment:
      MIGRATION_DATABASE_URL: postgres://cuadra:cuadra@postgres-e2e:5432/cuadra?sslmode=disable
      APP_DB_PASSWORD: app_user
    depends_on:
      postgres-e2e:
        condition: service_healthy

  api-e2e:
    build:
      context: backend
    profiles: [e2e]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://app_user:app_user@postgres-e2e:5432/cuadra?sslmode=disable
      JWT_SECRET: e2e-only-secret-not-for-real-use-0123456789
      OTEL_SDK_DISABLED: "true"
      LOG_LEVEL: warn
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      migrate-e2e:
        condition: service_completed_successfully

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
